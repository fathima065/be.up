name: be.up homepage deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original stable bundle without Home overlays
        shell: bash
        run: |
          set -e
          git show 27ad1ab71696d0518c18dc2c1712075cebb9085f:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # These scripts are the source of the injected Home graph/contact redesign.
          s=re.sub(r'\s*<script\s+src=["\']/(?:contact-demo|premium-redesign)\.js["\']\s*></script>', '', s, flags=re.I)
          # Keep only the shared responsive frame helper; do not inject any Home redesign.
          if '<script src="/responsive-frame.js"></script>' not in s:
              s=s.replace('</body>\n</html>', '<script src="/responsive-frame.js"></script>\n</body>\n</html>', 1)
          p.write_text(s)
          PY
      - name: Commit original Home bundle
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Stop Home redesign and contact injection scripts'
          git push
