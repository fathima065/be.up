# one-time website patch
name: Apply be.up website fixes

on:
  push:
    paths:
      - '.github/workflows/patch-site.yml'

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch website
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<div class="note">Each page below is the original file, rendered in its own isolated frame — so every page keeps its own styling and behavior exactly as built.</div>\n', '')
          s = s.replace('        <div class="aud-card"><h4>Preparing to Scale</h4><p>Build the capabilities required for the next stage.</p></div>\n', '')
          old = '''  function showPage(key){\n    if(!PAGES[key]){\n      errBanner.textContent = 'Page "' + key + '" was not found in this bundle.';\n      errBanner.style.display = 'block';\n      return;\n    }\n    errBanner.style.display = 'none';\n    frame.srcdoc = PAGES[key];\n    buttons.forEach(function(b){ b.classList.toggle('active', b.dataset.key === key); });\n  }\n\n  buttons.forEach(function(b){\n    b.addEventListener('click', function(){ showPage(b.dataset.key); });\n  });\n\n  showPage('home');'''
          new = '''  var ROUTES = {\n    home: '/',\n    about: '/about',\n    approach: '/approach',\n    services: '/services',\n    industries: '/industries',\n    'industry-detail': '/industries/professional-services',\n    insights: '/insights',\n    'insights-article': '/insights/business-functions-working-against-each-other',\n    contact: '/contact',\n    checkup: '/business-growth-checkup',\n    book: '/book-consultation'\n  };\n\n  var PATH_TO_KEY = {};\n  Object.keys(ROUTES).forEach(function(key){ PATH_TO_KEY[ROUTES[key]] = key; });\n  PATH_TO_KEY['/business-growth-checkup'] = 'checkup';\n  PATH_TO_KEY['/book'] = 'book';\n  PATH_TO_KEY['/insights/sample-article'] = 'insights-article';\n\n  function keyForPath(path){\n    if(PATH_TO_KEY[path]) return PATH_TO_KEY[path];\n    if(/^\\/services\\//.test(path)) return 'services';\n    if(/^\\/industries\\//.test(path)) return path === '/industries/professional-services' ? 'industry-detail' : 'industries';\n    return null;\n  }\n\n  function showPage(key, updateUrl){\n    if(!PAGES[key]){\n      errBanner.textContent = 'Page "' + key + '" was not found in this bundle.';\n      errBanner.style.display = 'block';\n      return;\n    }\n    errBanner.style.display = 'none';\n    frame.srcdoc = PAGES[key];\n    buttons.forEach(function(b){ b.classList.toggle('active', b.dataset.key === key); });\n    if(updateUrl !== false && ROUTES[key] && window.location.pathname !== ROUTES[key]){\n      window.history.pushState({key:key}, '', ROUTES[key]);\n    }\n  }\n\n  function bindFrameLinks(){\n    try{\n      var doc = frame.contentDocument;\n      if(!doc) return;\n      doc.addEventListener('click', function(event){\n        var link = event.target.closest ? event.target.closest('a[href]') : null;\n        if(!link) return;\n        var raw = link.getAttribute('href');\n        if(!raw || raw.charAt(0) !== '/') return;\n        var path = raw.split('?')[0].split('#')[0];\n        var key = keyForPath(path);\n        if(key){\n          event.preventDefault();\n          event.stopPropagation();\n          showPage(key, true);\n        }\n      }, true);\n    }catch(e){}\n  }\n\n  buttons.forEach(function(b){\n    b.addEventListener('click', function(){ showPage(b.dataset.key, true); });\n  });\n  frame.addEventListener('load', bindFrameLinks);\n  window.addEventListener('popstate', function(){\n    showPage(keyForPath(window.location.pathname) || 'home', false);\n  });\n\n  showPage(keyForPath(window.location.pathname) || 'home', false);'''
          if old not in s:
              raise SystemExit('Expected navigation block not found; refusing to modify index.html')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'be.up Website Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/patch-site.yml
          git commit -m 'Fix homepage navigation and simplify who we help'
          git push
