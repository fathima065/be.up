<!DOCTYPE html>
<html lang="en">
<head>

<title>be.up Consultancy — Combined Site Model</title>

<style>
  :root{
    --navy:#0B1F3A; --green:#1FA37A; --blue:#2E7DA8;
    --paper:#F6F5F1; --white:#FFFFFF; --slate:#5B6470; --line:rgba(11,31,58,0.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:'Inter',sans-serif;color:var(--navy);background:var(--paper);display:flex;flex-direction:column;}
  .shell-header{background:var(--navy);color:var(--white);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;flex-shrink:0;}
  .shell-header .brand{display:flex;align-items:center;gap:10px;}
  .shell-header .brand svg{height:22px;width:auto;}
  .shell-header .label{font-size:12px;font-weight:600;color:rgba(246,245,241,0.55);letter-spacing:0.03em;}
  .shell-nav{background:var(--white);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
  .navbtn{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:9px 14px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--slate);cursor:pointer;}
  .navbtn:hover{background:var(--paper);}
  .navbtn.active{background:var(--navy);color:var(--white);}
  .navbtn.indent{font-weight:500;color:var(--slate);font-size:12px;}
  .frame-wrap{flex:1;min-height:0;position:relative;}
  #page-frame{width:100%;height:100%;border:0;display:block;background:var(--white);}
  .note{font-size:11px;color:var(--slate);padding:6px 16px;background:var(--paper);border-bottom:1px solid var(--line);flex-shrink:0;}
  .err-banner{display:none;background:#B3402F;color:#fff;font-size:12px;padding:8px 16px;}
  @media (max-width:700px){
    .shell-nav{overflow-x:auto;flex-wrap:nowrap;}
    .navbtn{flex-shrink:0;}
  }
</style>
</head>

<script>
  var PAGES = {"home": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>be.up Consultancy | Business Growth &amp; Performance Consulting</title>\n<meta name=\"description\" content=\"be.up Consultancy helps businesses improve IT, finance, marketing, operations and sales to strengthen performance and achieve sustainable growth.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --navy:#0B1F3A; --navy-soft:#12294D;\n    --green:#1FA37A; --blue:#2E7DA8;\n    --paper:#F6F5F1; --white:#FFFFFF;\n    --slate:#5B6470; --line:rgba(11,31,58,0.12);\n    --line-dark:rgba(246,245,241,0.14);\n    --maxw:1240px;\n  }\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{margin:0;font-family:'Inter',sans-serif;color:var(--navy);background:var(--white);line-height:1.5;}\n  h1,h2,h3{font-family:'Manrope',sans-serif;margin:0;letter-spacing:-0.01em;}\n  p{margin:0;}\n  a{color:inherit;text-decoration:none;}\n  img,svg{display:block;max-width:100%;}\n  .maxw{max-width:var(--maxw);margin:0 auto;padding:0 40px;}\n  section{padding:120px 0;}\n  .kicker{font-size:13px;font-weight:600;color:var(--green);margin-bottom:16px;}\n  .fade-up{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease;}\n  .fade-up.in{opacity:1;transform:translateY(0);}\n  @media (prefers-reduced-motion:reduce){.fade-up{opacity:1;transform:none;transition:none;}}\n\n  /* BUTTONS */\n  .btn{display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;padding:14px 24px;border-radius:4px;cursor:pointer;border:1px solid transparent;transition:transform .15s ease;}\n  .btn:hover .arrow{transform:translateX(4px);}\n  .btn .arrow{display:inline-block;transition:transform .15s ease;}\n  .btn-primary{background:var(--green);color:var(--navy);}\n  .btn-ghost{background:transparent;color:var(--navy);border-color:var(--line);}\n  .btn-ghost.on-dark{color:var(--white);border-color:var(--line-dark);}\n  .btn-primary.small{padding:11px 18px;font-size:14px;}\n  a.textlink{font-weight:600;font-size:15px;color:var(--navy);display:inline-flex;align-items:center;gap:6px;}\n  a.textlink .arrow{transition:transform .15s ease;}\n  a.textlink:hover .arrow{transform:translateX(4px);}\n  a.textlink.on-dark{color:var(--white);}\n\n  /* HEADER */\n  header{position:fixed;top:0;left:0;right:0;z-index:50;padding:22px 0;transition:background .25s ease,box-shadow .25s ease,padding .25s ease;}\n  header .maxw{display:flex;align-items:center;justify-content:space-between;}\n  header.solid{background:var(--white);box-shadow:0 1px 0 var(--line);padding:16px 0;}\n  nav{display:flex;align-items:center;gap:36px;}\n  nav a{font-size:15px;font-weight:500;color:var(--white);}\n  header.solid nav a{color:var(--navy);}\n  .logo svg{height:26px;width:auto;}\n  .menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:8px;}\n  .menu-toggle span{display:block;width:22px;height:2px;background:var(--white);margin:5px 0;transition:background .2s;}\n  header.solid .menu-toggle span{background:var(--navy);}\n  .mobile-menu{display:none;}\n\n  /* HERO */\n  .hero{padding:200px 0 120px;background:var(--navy);color:var(--white);position:relative;overflow:hidden;}\n  .hero .maxw{display:grid;grid-template-columns:55% 45%;gap:40px;align-items:center;}\n  .hero-eyebrow{font-size:13px;font-weight:600;letter-spacing:0.04em;color:var(--green);margin-bottom:20px;}\n  .hero h1{font-size:56px;font-weight:800;line-height:1.08;}\n  .hero p.sub{margin-top:24px;font-size:17px;line-height:1.65;color:rgba(246,245,241,0.72);max-width:480px;}\n  .hero-ctas{margin-top:36px;display:flex;gap:16px;flex-wrap:wrap;}\n  .hero-visual{position:relative;height:380px;}\n  .node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transform:translateY(14px);animation:nodeIn .6s ease forwards;}\n  .node .dot{width:14px;height:14px;border-radius:50%;}\n  .node .label{font-size:12px;font-weight:600;color:rgba(246,245,241,0.75);white-space:nowrap;}\n  @keyframes nodeIn{to{opacity:1;transform:translateY(0);}}\n  @media (prefers-reduced-motion:reduce){.node{animation:none;opacity:1;transform:none;}}\n\n  /* CHALLENGE SECTION */\n  .challenge{background:var(--paper);}\n  .challenge .maxw{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start;}\n  .challenge h2{font-size:34px;font-weight:700;line-height:1.2;}\n  .challenge .lede{margin-top:20px;font-size:16px;color:var(--slate);line-height:1.7;max-width:420px;}\n  .challenge .lede strong{display:block;margin-top:16px;color:var(--navy);font-weight:600;}\n  .problem-list{display:flex;flex-direction:column;}\n  .problem-item{padding:20px 0;border-bottom:1px solid var(--line);font-size:17px;font-weight:600;color:var(--slate);opacity:0.4;transform:translateX(12px);transition:opacity .5s ease,transform .5s ease,color .5s ease;}\n  .problem-item.in{opacity:1;transform:translateX(0);color:var(--navy);}\n  .problem-item:last-child{border-bottom:none;}\n\n  /* CAPABILITIES */\n  .cap-head{text-align:center;max-width:600px;margin:0 auto 56px;}\n  .cap-head h2{font-size:34px;font-weight:700;}\n  .cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}\n  .cap-grid .row2{grid-column:span 3;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:0;}\n  .cap-card{border:1px solid var(--line);border-radius:6px;padding:32px;transition:transform .18s ease,border-color .18s ease,background .18s ease;}\n  .cap-card:hover{transform:translateY(-5px);border-color:var(--green);background:var(--paper);}\n  .cap-card .icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;}\n  .cap-card h3{font-size:18px;font-weight:700;margin-bottom:8px;}\n  .cap-card p{font-size:14px;color:var(--slate);margin-bottom:18px;line-height:1.6;}\n\n  /* INTEGRATED */\n  .integrated{background:var(--navy);color:var(--white);}\n  .integrated .maxw{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;}\n  .integrated h2{font-size:34px;font-weight:700;line-height:1.25;}\n  .integrated p.support{margin-top:20px;font-size:16px;color:rgba(246,245,241,0.68);line-height:1.7;max-width:440px;}\n  .flow-graphic{display:flex;flex-direction:column;gap:0;}\n  .flow-step{display:flex;align-items:center;gap:16px;padding:12px 0;}\n  .flow-step .num{width:8px;height:8px;border-radius:50%;flex-shrink:0;}\n  .flow-step .flabel{font-size:15px;font-weight:600;}\n  .flow-connector{width:1px;height:16px;background:rgba(246,245,241,0.2);margin-left:3.5px;}\n\n  /* FRAMEWORK */\n  .framework{background:var(--paper);}\n  .fw-head{text-align:center;max-width:600px;margin:0 auto 56px;}\n  .fw-head h2{font-size:34px;font-weight:700;}\n  .fw-head .sub{margin-top:16px;font-size:16px;color:var(--slate);line-height:1.6;}\n  .fw-track{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:0;}\n  .fw-step{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:22px 20px;width:170px;cursor:pointer;transition:border-color .18s ease,transform .18s ease;}\n  .fw-step:hover,.fw-step.active{border-color:var(--green);transform:translateY(-3px);}\n  .fw-step .fw-num{font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px;}\n  .fw-step .fw-title{font-size:16px;font-weight:700;margin-bottom:8px;}\n  .fw-step .fw-desc{font-size:13px;color:var(--slate);line-height:1.55;max-height:0;overflow:hidden;transition:max-height .25s ease;}\n  .fw-step.active .fw-desc{max-height:120px;}\n  .fw-arrow{color:var(--slate);font-size:18px;margin:0 8px;}\n\n  /* WHY */\n  .why .maxw{display:grid;grid-template-columns:0.9fr 1.1fr;gap:64px;}\n  .why h2{font-size:34px;font-weight:700;line-height:1.2;}\n  .value-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);}\n  .value-card{background:var(--white);padding:32px;}\n  .value-card .vnum{font-size:13px;font-weight:700;color:var(--green);margin-bottom:12px;}\n  .value-card h3{font-size:17px;font-weight:700;margin-bottom:8px;}\n  .value-card p{font-size:14px;color:var(--slate);line-height:1.6;}\n\n  /* WHO WE HELP */\n  .who{background:var(--navy);color:var(--white);}\n  .who-head{max-width:560px;margin-bottom:56px;}\n  .who-head h2{font-size:34px;font-weight:700;}\n  .who-head p{margin-top:16px;color:rgba(246,245,241,0.68);font-size:16px;line-height:1.6;}\n  .aud-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line-dark);}\n  .aud-card{background:var(--navy);padding:28px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;}\n  .aud-card h4{font-size:15px;font-weight:700;margin-bottom:8px;}\n  .aud-card p{font-size:13px;color:rgba(246,245,241,0.6);line-height:1.5;}\n\n  /* TRUST */\n  .trust{text-align:center;}\n  .trust h2{font-size:28px;font-weight:700;}\n  .trust p{margin:16px auto 0;max-width:480px;font-size:15px;color:var(--slate);line-height:1.6;}\n\n  /* FINAL CTA */\n  .final-cta{background:var(--navy);color:var(--white);text-align:center;position:relative;overflow:hidden;padding:140px 0;}\n  .final-cta h2{font-size:42px;font-weight:700;line-height:1.15;max-width:640px;margin:0 auto;}\n  .final-cta p{margin:24px auto 0;max-width:480px;font-size:16px;color:rgba(246,245,241,0.7);line-height:1.6;}\n  .final-cta .ctas{margin-top:36px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}\n  .final-cta .bg-arrow{position:absolute;bottom:-60px;left:50%;transform:translateX(-50%);opacity:0.12;pointer-events:none;}\n\n  /* FOOTER */\n  footer{background:var(--navy-soft);color:rgba(246,245,241,0.8);padding:72px 0 32px;}\n  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1.4fr 1fr;gap:40px;padding-bottom:48px;border-bottom:1px solid var(--line-dark);}\n  .footer-grid h5{font-size:13px;font-weight:600;color:rgba(246,245,241,0.5);margin-bottom:18px;}\n  .footer-grid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;}\n  .footer-grid a{font-size:14px;}\n  .footer-bottom{display:flex;justify-content:space-between;padding-top:24px;font-size:13px;color:rgba(246,245,241,0.5);flex-wrap:wrap;gap:12px;}\n\n  @media (max-width:960px){\n    section{padding:80px 0;}\n    .maxw{padding:0 24px;}\n    .hero{padding:140px 0 80px;}\n    .hero .maxw,.challenge .maxw,.integrated .maxw,.why .maxw{grid-template-columns:1fr;}\n    .hero h1{font-size:38px;}\n    .hero-visual{margin-top:40px;height:280px;}\n    .cap-grid,.cap-grid .row2{grid-template-columns:1fr;}\n    .aud-grid{grid-template-columns:repeat(2,1fr);}\n    .value-grid{grid-template-columns:1fr;}\n    .footer-grid{grid-template-columns:1fr 1fr;}\n    nav{display:none;}\n    .menu-toggle{display:block;}\n    .fw-arrow{display:none;}\n    .fw-track{flex-direction:column;align-items:stretch;}\n    .fw-step{width:100%;}\n  }\n</style>\n</head>\n<body>\n\n<header id=\"site-header\">\n  <div class=\"maxw\">\n    <a href=\"/\" class=\"logo\">\n      <svg viewBox=\"0 0 220 44\" xmlns=\"http://www.w3.org/2000/svg\">\n        <text x=\"0\" y=\"32\" font-family=\"Manrope\" font-weight=\"800\" font-size=\"34\" fill=\"currentColor\" id=\"logo-text-1\">be</text>\n        <g transform=\"translate(50,10)\"><path d=\"M0 20 L9 6 L18 20\" fill=\"none\" stroke=\"#1FA37A\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g>\n        <text x=\"72\" y=\"32\" font-family=\"Manrope\" font-weight=\"800\" font-size=\"34\" fill=\"currentColor\" id=\"logo-text-2\">up</text>\n      </svg>\n    </a>\n    <nav>\n      <a href=\"/about\">About</a>\n      <a href=\"/services\">Services</a>\n      <a href=\"/approach\">Our Approach</a>\n      <a href=\"/contact\">Contact</a>\n    </nav>\n    <a href=\"/contact\" class=\"btn btn-primary small\" style=\"display:none\" class=\"desktop-cta\">Talk to a Consultant</a>\n    <button class=\"menu-toggle\" aria-label=\"Open menu\"><span></span><span></span><span></span></button>\n  </div>\n</header>\n\n<main>\n\n  <!-- HERO -->\n  <section class=\"hero\">\n    <div class=\"maxw\">\n      <div>\n        <div class=\"hero-eyebrow\">Business Excellence &amp; Unlimited Performance</div>\n        <h1>Your Growth.<br>Our Solution.</h1>\n        <p class=\"sub\">We help businesses build stronger systems, improve performance, and achieve sustainable growth across IT, Finance, Marketing, Operations, and Sales.</p>\n        <div class=\"hero-ctas\">\n          <a href=\"/contact\" class=\"btn btn-primary\">Talk to a Consultant <span class=\"arrow\">\u2192</span></a>\n          <a href=\"/services\" class=\"btn btn-ghost on-dark\">Explore Our Services <span class=\"arrow\">\u2192</span></a>\n        </div>\n      </div>\n      <div class=\"hero-visual\" id=\"hero-visual\" aria-hidden=\"true\">\n        <!-- nodes positioned around a central be.up growth point -->\n        <div class=\"node\" style=\"top:0;left:38%;animation-delay:.5s;\"><div class=\"dot\" style=\"background:#2E7DA8;\"></div><div class=\"label\">IT</div></div>\n        <div class=\"node\" style=\"top:36%;left:2%;animation-delay:.65s;\"><div class=\"dot\" style=\"background:#1FA37A;\"></div><div class=\"label\">MARKETING</div></div>\n        <div class=\"node\" style=\"top:36%;left:74%;animation-delay:.8s;\"><div class=\"dot\" style=\"background:#1FA37A;\"></div><div class=\"label\">SALES</div></div>\n        <div class=\"node\" style=\"top:70%;left:16%;animation-delay:.95s;\"><div class=\"dot\" style=\"background:#2E7DA8;\"></div><div class=\"label\">OPERATIONS</div></div>\n        <div class=\"node\" style=\"top:70%;left:56%;animation-delay:1.1s;\"><div class=\"dot\" style=\"background:#2E7DA8;\"></div><div class=\"label\">FINANCE</div></div>\n        <svg viewBox=\"0 0 340 380\" style=\"position:absolute;inset:0;width:100%;height:100%;\">\n          <line x1=\"150\" y1=\"40\" x2=\"170\" y2=\"180\" stroke=\"rgba(246,245,241,0.25)\" stroke-width=\"1\"/>\n          <line x1=\"60\" y1=\"150\" x2=\"170\" y2=\"180\" stroke=\"rgba(246,245,241,0.25)\" stroke-width=\"1\"/>\n          <line x1=\"270\" y1=\"150\" x2=\"170\" y2=\"180\" stroke=\"rgba(246,245,241,0.25)\" stroke-width=\"1\"/>\n          <line x1=\"90\" y1=\"270\" x2=\"170\" y2=\"180\" stroke=\"rgba(246,245,241,0.25)\" stroke-width=\"1\"/>\n          <line x1=\"220\" y1=\"270\" x2=\"170\" y2=\"180\" stroke=\"rgba(246,245,241,0.25)\" stroke-width=\"1\"/>\n          <circle cx=\"170\" cy=\"180\" r=\"10\" fill=\"#1FA37A\"/>\n        </svg>\n      </div>\n    </div>\n  </section>\n\n  <!-- CHALLENGE -->\n  <section class=\"challenge\">\n    <div class=\"maxw\">\n      <div class=\"fade-up\">\n        <div class=\"kicker\">Growth brings challenges</div>\n        <h2>Business growth shouldn't mean business complexity.</h2>\n        <p class=\"lede\">As businesses grow, new challenges appear \u2014 disconnected systems, inefficient processes, limited financial visibility, inconsistent marketing, and unpredictable sales.<strong>be.up brings the pieces together.</strong></p>\n      </div>\n      <div class=\"problem-list\">\n        <div class=\"problem-item fade-up\">Disconnected Systems</div>\n        <div class=\"problem-item fade-up\">Inefficient Processes</div>\n        <div class=\"problem-item fade-up\">Limited Financial Visibility</div>\n        <div class=\"problem-item fade-up\">Inconsistent Marketing</div>\n        <div class=\"problem-item fade-up\">Unpredictable Sales</div>\n      </div>\n    </div>\n  </section>\n\n  <!-- CAPABILITIES -->\n  <section class=\"capabilities\">\n    <div class=\"maxw\">\n      <div class=\"cap-head fade-up\">\n        <div class=\"kicker\" style=\"justify-content:center;display:f stroke=\"#1FA37A\" stroke-width=\"2\"><path d=\"M4 4h16v6H4zM4 14h10v6H4z\"/></svg></div>\n            <h3>Operations &amp; Process Excellence</h3>\n            <p>Better processes. Higher productivity.</p>\n            <a href=\"/services/operations\" class=\"textlink\">Discuss Your Operations Challenge <span class=\"arrow\">\u2192</span></a>\n          </div>\n          <div class=\"cap-card fade-up\">\n            <div class=\"icon\" style=\"background:rgba(46,125,168,0.12);\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E7DA8\" stroke-width=\"2\"><path d=\"M3 3v18h18M7 15l4-4 3 3 5-6\"/></svg></div>\n            <h3>Sales &amp; Revenue Growth</h3>\n            <p>More leads. More revenue.</p>\n            <a href=\"/services/sales\" class=\"textlink\">Discuss Your Sales Challenge <span class=\"arrow\">\u2192</span></a>\n          </div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <!-- INTEGRATED -->\n  <section class=\"integrated\">\n    <div class=\"maxw\">\n      <div class=\"fade-up\">\n        <div class=\"kicker\">One connected business</div>\n        <h2>Your business is connected.<br>Your solutions should be too.</h2>\n        <p class=\"support\">be.up doesn't look at your business through a single department. We look at how the whole business works together.</p>\n        <div style=\"margin-top:32px;\">\n          <a href=\"/approach\" class=\"textlink on-dark\">Explore Our Integrated Approach <span class=\"arrow\">\u2192</span></a>\n        </div>\n      </div>\n      <div class=\"flow-graphic fade-up\">\n        <div class=\"flow-step\"><div class=\"num\" style=\"background:#1FA37A;\"></div><div class=\"flabel\">Marketing generates demand</div></div>\n        <div class=\"flow-connector\"></div>\n        <div class=\"flow-step\"><div class=\"num\" style=\"background:#1FA37A;\"></div><div class=\"flabel\">Sales converts it</div></div>\n        <div class=\"flow-connector\"></div>\n        <div class=\" -title\">Execute</div><div class=\"fw-desc\">Turn strategy into structured action.</div></div>\n        <span class=\"fw-arrow\">\u2192</span>\n        <div class=\"fw-step\" data-step=\"5\"><div class=\"fw-num\">05</div><div class=\"fw-title\">Optimize</div><div class=\"fw-desc\">Measure performance and continuously improve.</div></div>\n        <span class=\"fw-arrow\">\u2192</span>\n        <div class=\"fw-step\" data-step=\"6\"><div class=\"fw-num\">06</div><div class=\"fw-title\">Grow</div><div class=\"fw-desc\">Build stronger capabilities for sustainable growth.</div></div>\n      </div>\n      <div style=\"text-align:center;margin-top:40px;\">\n        <a href=\"/approach\" class=\"textlink\">Discover Our Approach <span class=\"arrow\">\u2192</span></a>\n      </div>\n    </div>\n  </section>\n\n  <!-- WHY -->\n  <section class=\"why\">\n    <div class=\"maxw\">\n      <div class=\"fade-up\">\n        <h2>More than advice.<br>A partner for growth.</h2>\n      </div>\n      <div class=\"value-grid fade-up\">\n        <div class=\"value-card\"><div class=\"vnum\">01</div><h3>Integrated Expertise</h3><p>Five critical business capabilities working together under one consulting partner.</p></div>\n        <div class=\"value-card\"><div class=\"vnum\">02</div><h3>Practical Solutions</h3><p>We focus on solutions that can be implemented, measured, and improved.</p></div>\n        <div class=\"value-card\"><div class=\"vnum\">03</div><h3>Business-Focused</h3><p>Our recommendations are designed around real business priorities and outcomes.</p></div>\n        <div class=\"value-card\"><div class=\"vnum\">04</div><h3>Collaborative</h3><p>We work alongside your team to create change that lasts.</p></div>\n      </div>\n    </div>\n  </section>\n\n  <!-- WHO WE HELP -->\n  <section class=\"who\">\n    <div class=\"maxw\">\n      <div class=\"who-head fade-up\">\n        <div class=\"kicker\">Who we help</div>\n        <h2>Built for businesses ready to move up.</h2>\n hts reserved.</span>\n      <span><a href=\"/privacy\">Privacy Policy</a> &nbsp;|&nbsp; <a href=\"/terms\">Terms &amp; Conditions</a></span>\n    </div>\n  </div>\n</footer>\n\n<script>\n  // header solid on scroll\n  const header = document.getElementById('site-header');\n  const onScroll = () => header.classList.toggle('solid', window.scrollY > 40);\n  document.addEventListener('scroll', onScroll);\n  onScroll();\n\n  // scroll-triggered fade-ups and problem-item connect animation\n  const io = new IntersectionObserver((entries) => {\n    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });\n  }, { threshold: 0.2 });\n  document.querySelectorAll('.fade-up, .problem-item').forEach(el => io.observe(el));\n\n  // framework step click-to-reveal (accordion-style, first open by default)\n  const steps = document.querySelectorAll('.fw-step');\n  steps.forEach(step => {\n    step.addEventListener('click', () => {\n      const wasActive = step.classList.contains('active');\n      steps.forEach(s => s.classList.remove('active'));\n      if (!wasActive) step.classList.add('active');\n    });\n  });\n  steps[0].classList.add('active');\n<\/script>\n\n</body>\n</html>\n", "about": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>About | be.up Consultancy</title>\n<meta name=\"description\" content=\"be.up Consultancy exists to help growing businesses connect IT, finance, marketing, operations and sales into one integrated growth system.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --navy:#0B1F3A; --navy-soft:#12294D;\n    --green:#1FA37A; --blue:#2E7DA8;\n    --paper:#F6F5F1; --white:#FFFFFF;\n    --slate:#5B6470; --line:rgba(11,31,58,0.12);\n    --line-dark:rgba(246,245,241,0.14);\n    --maxw:1240px;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:'Inter',sans-serif;color:var(--navy);background:var(--white);line-height:1.5;}\n  h1,h2,h3{font-family:'Manrope',sans-serif;margin:0;letter-spacing:-0.01em;}\n  p{margin:0;}\n  a{color:inherit;text-decoration:none;}\n  .maxw{max-width:var(--maxw);margin:0 auto;padding:0 40px;}\n  section{padding:96px 0;}\n  .kicker{font-size:13px;font-weight:600;color:var(--green);margin-bottom:16px;}\n\n  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:14px 24px;border-radius:4px;cursor:pointer;border:1px solid transparent;}\n  .btn .arrow{transition:transform .15s ease;}\n  .btn:hover .arrow{transform:translateX(4px);}\n  .btn-primary{background:var(--green);color:var(--navy);}\n\n  header{padding:20px 0;border-bottom:1px solid var(--line);}\n  header .maxw{display:flex;align-items:center;justify-content:space-between;}\n  nav{display:flex;align-items:center;gap:32px;}\n  nav a{font-size:14px;font-weight:500;color:var(--navy);}\n  nav a.current{color:var(--green);}\n  .logo svg{height:24px;width:auto;}\n\n  .breadcrumb{font-size:13px;color:var(--slate);padding:24px 0 0;}\n  .breadcrumb a{color:var(--slate);}\n  .breadcrumb .sep{margin:0 8px;}\n\n  /* HERO */\n  .about-hero{padding:48px 0 80px;}\n  .about-hero h1{font-size:44px;font-weight:700;line-height:1.15;max-width:680px;}\n  .about-hero p{margin-top:20px;font-size:17px;color:var(--slate);line-height:1.65;max-width:600px;}\n\n  /* WHY WE EXIST */\n  .why-exist{background:var(--paper);}\n  .why-exist .maxw{display:grid;grid-template-columns:0.9fr 1.1fr;gap:64px;}\n  .why-exist h2{font-size:30px;font-weight:700;line-height:1.25;max-width:380px;}\n  .why-exist .body-copy p{font-size:16px;color:var(--slate);line-height:1.75;margin-bottom:18px;}\n  .why-exist .body-copy p:last-child{margin-bottom:0;}\n  .body-copy strong{color:var(--navy);font-weight:600;}\n\n  /* VALUES */\n  .values-head{max-width:560px;margin-bottom:48px;}\n  .values-head h2{font-size:30px;font-weight:700;}\n  .values-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}\n  .value-card{background:var(--white);padding:32px;}\n  .value-card .vnum{font-size:13px;font-weight:700;color:var(--green);margin-bottom:12px;}\n  .value-card h3{font-size:17px;font-weight:700;margin-bottom:8px;}\n  .value-card p{font-size:14px;color:var(--slate);line-height:1.6;}\n\n  /* TEAM */\n  .team{background:var(--navy);color:var(--white);}\n  .team-head{max-width:560px;margin-bottom:48px;}\n  .team-head h2{font-size:30px;font-weight:700;}\n  .team-head p{margin-top:14px;font-size:15px;color:rgba(246,245,241,0.65);line-height:1.6;}\n  .team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}\n  .team-card{background:var(--navy-soft);border-radius:8px;padding:28px;}\n  .team-photo{width:64px;height:64px;border-radius:50%;background:rgba(246,245,241,0.12);margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(246,245,241,0.4);text-align:center;line-height:1.3;}\n  .team-card h4{font-size:16px;font-weight:700;margin-bottom:4px;}\n  .team-card .role{font-size:13px;color:var(--green);font-weight:600;margin-bottom:12px;}\n  .team-card p.bio{font-size:13px;color:rgba(246,245,241,0.6);line-height:1.6;}\n  .dev-note{margin-top:32px;font-size:13px;color:rgba(246,245,241,0.45);font-style:italic;}\n\n  /* CTA */\n  .about-cta{text-align:center;}\n  .about-cta h2{font-size:28px;font-weight:700;max-width:520px;margin:0 auto;}\n  .about-cta p{margin:16px auto 28px;max-width:460px;font-size:15px;color:var(--slate);line-height:1.6;}\n\n  footer{background:var(--navy-soft);color:rgba(246,245,241,0.7);padding:40px 0;text-align:center;font-size:13px;}\n\n  @media (max-width:900px){\n    .maxw{padding:0 24px;}\n    nav{display:none;}\n    .about-hero h1{font-size:30px;}\n    .why-exist .maxw{grid-template-columns:1fr;}\n    .values-grid,.team-grid{grid-template-columns:1fr;}\n  }\n</style>\n</head>\n<body>\n\n<header>\n  <div class=\"maxw\">\n    <a href=\"/\" class=\"logo\">\n      <svg viewBox=\"0 0 220 44\" xmlns=\"http://www.w3.org/2000/svg\">\n        <text x=\"0\" y=\"32\" font-family=\"Manrope\" font-weight=\"800\" font-size=\"34\" fill=\"#0B1F3A\">be</text>\n        <g transform=\"translate(50,10)\"><path d=\"M0 20 L9 6 L18 20\" fill=\"none\" stroke=\"#1FA37A\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g>\n        <text x=\"72\" y=\"32\" font-family=\"Manrope\" font-weight=\"800\" font-size=\"34\" fill=\"#0B1F3A\">up</text>\n      </svg>\n    </a>\n    <nav>\n      <a href=\"/about\" class=\"current\">About</a>\n      <a href=\"/services\">Services</a>\n      <a href=\"/approach\">Our Approach</a>\n      <a href=\"/industries\">Industries</a>\n      <a href=\"/insights\">Insights</a>\n      <a href=\"/contact\">Contact</a>\n    </nav>\n    <a href=\"/contact\" class=\"btn btn-primary\" style=\"padding:11px 18px;font-size:14px;\">Talk to a Consultant</a>\n  </div>\n</header>\n\n<div class=\"maxw breadcrumb\"><a href=\"/\">Home</a><span class=\"sep\">/</span>About</div>\n\n<section class=\"about-hero\">\n  <div class=\"maxw\">\n    <div class=\"kicker\">About be.up</div>\n    <h1>We started be.up because growth advice is usually given one department at a time.</h1>\n    <p>Most businesses don't fail from a lack of ideas. They stall because IT, finance, marketing, operations, and sales all move at different speeds, pointed in slightly different directions. be.up exists to bring those functions back into one system.</p>\n  </div>\n</section>\n\n<!-- WHY WE EXIST -->\n<section class=\"why-exist\">\n  <div class=\"maxw\">\n    <div>\n      <div class=\"kicker\">Why we exist</div>\n      <h2>Business Excellence &amp; Unlimited Performance, not just Business Excellence.</h2>\n    </div>\n    <div class=\"body-copy\">\n      <p><strong>Business Excellence</strong> is the discipline \u2014 doing each function well: sound finances, working technology, a functioning sales process, a coherent brand.</p>\n      <p><strong>Unlimited Performance</strong> is what happens when those functions are connected instead of siloed \u2014 when a change in pricing shows up in the marketing message, when a sales insight reaches operations, when a technology decision is made with finance in the room.</p>\n      <p>Most consultancies specialize in one function and hand you off when the problem crosses into another. be.up was built to stay in the room for the whole picture \u2014 because that's usually where the actual constraint on growth is hiding.</p>\n    </div>\n  </div>\n</section>\n\n<!-- VALUES -->\n<section>\n  <div class=\"maxw\">\n    <div class=\"values-head\">\n      <div class=\"kicker\">What we believe</div>\n      <h2>The principles behind how we work.</h2>\n    </div>\n    <div class=\"values-grid\">\n      <div class=\"value-card\"><div class=\"vnum\">01</div><h3>Systems over silos</h3><p>A business is one connected system. We diagnose and design accordingly, not department by department.</p></div>\n      <div class=\"value-card\"><div class=\"vnum\">02</div><h3>Practical over theoretical</h3><p>Every recommendation is something your team can actually implement, measure, and adjust.</p></div>\n      <div class=\"value-card\"><div class=\"vnum\">03</div><h3>Evidence over opinion</h3><p>Decisions are grounded in your numbers and your market, not a generic playbook.</p></div>\n      <div class=\"value-card\"><div class=\"vnum\">04</div><h3>Partnership over handoff</h3><p>We work alongside your team through implementation, not just at the strategy stage.</p></div>\n      <div class=\"value-card\"><div class=\"vnum\">05</div><h3>Clarity over jargon</h3><p>If a recommendation can't be explained plainly, it isn't ready to act on yet.</p></div>\n      <div class=\"value-card\"><div class=\"vnum\">06</div><h3>Momentum over perfection</h3><p>Sustainable growth comes from consistent, compounding improvement \u2014 not a single big fix.</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- TEAM -->\n<section class=\"team\">\n  <div class=\"maxw\">\n    <div class=\"team-head\">\n      <div class=\"kicker\">Who's behind be.up</div>\n      <h2>The team.</h2>\n      <p>This section is scaffolded for real team profiles \u2014 photo, name, role, and a short bio per person.</p>\n    </div>\n    <div class=\"team-grid\">\n      <div class=\"team-card\">\n        <div class=\"team-photo\">Photo</div>\n        <h4>[Name]</h4>\n        <div class=\"role\">[Role / Title]</div>\n        <p class=\"bio\">[One or two sentences on background and focus area \u2014 replace with real bio before launch.]</p>\n      </div>\n      <div class=\"team-card\">\n        <div class=\"team-photo\">Photo</div>\n        <h4>[Name]</h4>\n        <div class=\"role\">[Role / Title]</div>\n        <p class=\"bio\">[One or two sentences on background and focus area \u2014 replace with real bio before launch.]</p>\n      </div>\n      <div class=\"team-card\">\n        <div class=\"team-photo\">Photo</div>\n        <h4>[Name]</h4>\n        <div class=\"role\">[Role / Title]</div>\n        <p class=\"bio\">[One or two sentences on background and focus area \u2014 replace with real bio before launch.]</p>\n      </div>\n    </div>\n    <p class=\"dev-note\">Developer note: do not publish this section with placeholder names/bios. Real headshots and credentials matter more here than almost anywhere else on the site \u2014 this is where \"why should I trust be.up\" gets answered or lost.</p>\n  </div>\n</section>\n\n<!-- CTA -->\n<section class=\"about-cta\">\n  <div class=\"maxw\">\n    <h2>Want to know how we'd approach your business specifically?</h2>\n    <p>The best way to understand be.up is to talk through your situation directly.</p>\n    <a href=\"/contact\" class=\"btn btn-primary\">Talk to a Consultant <span class=\"arrow\">\u2192</span></a>\n  </div>\n</section>\n\n<footer>\u00a9 2026 be.up Consultancy. All rights reserved.</footer>\n\n</body>\n</html>\n", "approach": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Our Approach | be.up Consultancy</title>\n<meta name=\"description\" content=\"be.up's six-stage methodology moves businesses from Assess to Grow \u2014 connecting IT, finance, marketing, operations and sales into one practical growth system.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --navy:#0B1F3A; --navy-soft:#12294D;\n    --green:#1FA37A; --blue:#2E7DA8;\n    --paper:#F6F5F1; --white:#FFFFFF;\n    --slate:#5B6470; --line:rgba(11,31,58,0.12);\n    --line-dark:rgba(246,245,241,0.14);\n    --maxw:1240px;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:'Inter',sans-serif;color:var(--navy);background:var(--white);line-height:1.5;}\n  h1,h2,h3{font-family:'Manrope',sans-serif;margin:0;letter-spacing:-0.01em;}\n  p{margin:0;}\n  a{color:inherit;text-decoration:none;}\n  .maxw{max-width:var(--maxw);margin:0 auto;padding:0 40px;}\n  section{padding:96px 0;}\n  .kicker{font-size:13px;font-weight:600;color:var(--green);margin-bottom:16px;}\n\n  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:14px 24px;border-radius:4px;cursor:pointer;border:1px solid transparent;}\n  .btn .arrow{transition:transform .15s ease;}\n  .btn:hover .arrow{transform:translateX(4px);}\n  .btn-primary{background:var(--green);color:var(--navy);}\n\n  header{padding:20px 0;border-bottom:1px solid var(--line);}\n  header .maxw{display:flex;align-items:center;justify-content:space-between;}\n  nav{display:flex;align-items:center;gap:32px;}\n  nav a{font-size:14px;font-weight:500;color:var(--navy);}\n  nav a.current{color:var(--green);}\n  .logo svg{height:24px;width:auto;}\n\n  .breadcrumb{font-size:13px;color:var(--slate);padding:24px 0 0;}\n  .breadcrumb a{color:var(--slate);}\n  .breadcrumb .sep{margin:0 8px;}\n\n  /* HERO */\n  .app-hero{padding:48px 0 72px;}\n  .app-hero h1{font-size:44px;font-weight:700;line-height:1.15;max-width:680px;}\n  .app-hero p{margin-top:20px;font-size:17px;color:var(--slate);line-height:1.65;max-width:600px;}\n\n  /* PRINCIPLES */\n  .principles{background:var(--paper);}\n  .principles-head{max-width:560px;margin-bottom:48px;}\n  .principles-head h2{font-size:30px;font-weight:700;}\n  .principle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}\n  .principle-card{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:28px;}\n  .principle-card .pnum{font-size:13px;font-weight:700;color:var(--green);margin-bottom:12px;}\n  .principle-card h3{font-size:16px;font-weight:700;margin-bottom:8px;}\n  .principle-card p{font-size:13px;color:var(--slate);line-height:1.6;}\n\n  /* FRAMEWORK DETAIL */\n  .fw-head{max-width:600px;margin-bottom:56px;}\n  .fw-head h2{font-size:30px;font-weight:700;}\n  .fw-head p{margin-top:14px;font-size:15px;color:var(--slate);line-height:1.6;}\n  .fw-detail{display:flex;flex-direction:column;}\n  .fw-row{display:grid;grid-template-columns:120px 1fr 1.4fr;gap:32px;padding:32px 0;border-bottom:1px solid var(--line);align-items:start;}\n  .fw-row:first-child{padding-top:0;}\n  .fw-row:last-child{border-bottom:none;}\n  .fw-row .fw-num{font-size:32px;font-weight:800;color:var(--line);font-family:'Manrope',sans-serif;}\n  .fw-row h3{font-size:19px;font-weight:700;}\n  .fw-row .fw-what{font-size:14px;color:var(--slate);line-height:1.6;}\n  .fw-row .fw-detail-text{font-size:14px;color:var(--slate);line-height:1.65;}\n  .fw-row .fw-detail-text strong{color:var(--navy);}\n\n  /* ENGAGEMENT MODEL */\n  .engage{background:var(--navy);color:var(--white);}\n  .engage-head{max-width:560px;margin-bottom:48px;}\n  .engage-head h2{font-size:30px;font-weight:700;}\n  .engage-head p{margin-top:14px;font-size:15px;color:rgba(246,245,241,0.65);line-height:1.6;}\n  .engage-track{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}\n  .engage-step{background:var(--navy-soft);border-radius:6px;padding:26px;}\n  .engage-step .enum{font-size:13px;font-weight:700;color:var(--green);margin-bottom:12px;}\n  .engage-step h4{font-size:15px;font-weight:700;margin-bottom:8px;}\n  .engage-step p{font-size:13px;color:rgba(246,245,241,0.6);line-height:1.55;}\n\n  /* CTA */\n  .app-cta{text-align:center;}\n  .app-cta h2{font-size:28px;font-weight:700;max-width:520px;margin:0 auto;}\n  .app-cta p{margin:16px auto 28px;max-width:460px;font-size:15px;color:var(--slate);line-height:1.6;}\n\n  footer{background:var(--navy-soft);color:rgba(246,245,241,0.7);padding:40px 0;text-align:center;font-size:13px;}\n\n  @media (max-width:900px){\n    .maxw{padding:0 24px;}\n    nav{display:none;}\n    .app-hero h1{font-size:30px;}\n    .principle-grid{grid-template-columns:1fr 1fr;}\n    .fw-row{grid-template-columns:1fr;gap:8px;}\n    .engage-track{grid-template-columns:1fr 1fr;}\n  }\n</style>\n</head>\n<body>\n\n<header>\n  <div class=\"maxw\">\n    <a href=\"/\" class=\"logo\">\n      <svg viewBox=\"0 0 220 44\" xmlns=\"http://www.w3.org/2000/svg\">\n        <text x=\"0\" y=\"32\" font-family=\"Manrope\" font-weight=\"800\" font-size=\"34\" fill=\"#0B1F3A\">be</text>\n        <g transform=\"translate(50,10)\"><path d=\"M0 20 L9 6 L18 20\" fill=\"none\" stroke=\"#1FA37A\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g>\n        <text x=\"72\" y=\"32\" font-family=\"Manrope\" font-weight=\"800\" font-size=\"34\" fill=\"#0B1F3A\">up</text>\n      </svg>\n    </a>\n    <nav>\n      <a href=\"/about\">About</a>\n      <a href=\"/services\">Services</a>\n      <a href=\"/approach\" class=\"current\">Our Approach</a>\n      <a href=\"/industries\">Industries</a>\n      <a href=\"/insights\">Insights</a>\n      <a href=\"/contact\">Contact</a>\n    </nav>\n    <a href=\"/contact\" class=\"btn btn-primary\" style=\"padding:11px 18px;font-size:14px;\">Talk to a Consultant</a>\n  </div>\n</header>\n\n<div class=\"maxw breadcrumb\"><a href=\"/\">Home</a><span class=\"sep\">/</span>Our Approach</div>\n\n<section class=\"app-hero\">\n  <div class=\"maxw\">\n    <div class=\"kicker\">Our Approach</div>\n    <h1>A structured way of working, not a one-off engagement.</h1>\n    <p>Sustainable growth requires more than good ideas \u2014 it requires a repeatable process for finding what's actually holding a business back, fixing it, and measuring whether it worked. This is that process.</p>\n  </div>\n</section>\n\n<!-- PRINCIPLES -->\n<section class=\"principles\">\n  <div class=\"maxw\">\n    <div class=\"principles-head\">\n      <div class=\"kicker\">How we think</div>\n      <h2>Four principles that shape every engagement.</h2>\n    </div>\n    <div class=\"principle-grid\">\n      <div class=\"principle-card\"><div class=\"pnum\">01</div><h3>Integrated Expertise</h3><p>Five critical business capabilities working together under one consulting partner.</p></div>\n      <div class=\"principle-card\"><div class=\"pnum\">02</div><h3>Practical Solutions</h3><p>We focus on implementation, not recommendations that remain on paper.</p></div>\n      <div class=\"principle-card\"><div class=\"pnum\">03</div><h3>Business-Focused</h3><p>Solutions are connected to real business priorities and outcomes.</p></div>\n      <div class=\"principle-card\"><div class=\"pnum\">04</div><h3>Collaborative</h3><p>We work alongside your team to create sustainable improvement.</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- FRAMEWORK DETAIL -->\n<section>\n  <div class=\"maxw\">\n    <div class=\"fw-head\">\n      <div class=\"kicker\">The be.up Growth Framework</div>\n      <h2>From Challenge to Growth, in six stages.</h2>\n      <p>Every engagement \u2014 regardless of which capabilities are involved \u2014 moves through the same six stages. It's a cycle, not a straight line: Grow feeds back into Assess as your business changes.</p>\n    </div>\n    <div class=\"fw-detail\">\n      <div class=\"fw-row\">\n        <div class=\"fw-num\">01</div>\n        <div><h3>Assess</h3><p class=\"fw-what\">Understand your business, challenges, goals, and opportunities.</p></div>\n        <div class=\"fw-detail-text\">We start with your numbers, your team, and your market \u2014 not a template. <strong>Output:</strong> a clear picture of where growth is currently constrained.</div>\n      </div>\n      <div class=\"fw-row\">\n        <div class=\"fw-num\">02</div>\n        <div><h3>Strategize</h3><p class=\"fw-what\">Define priorities and create a practical roadmap.</p></div>\n        <div class=\"fw-detail-text\">We prioritize by impact and feasibility, not by what's easiest to sell. <strong>Output:</strong> a roadmap your team can actually execute.</div>\n      </div>\n      <div class=\"fw-row\">\n        <div class=\"fw-num\">03</div>\n        <div><h3>Build</h3><p class=\"fw-what\">Develop the systems, processes, and capabilities required.</p></div>\n        <div class=\"fw-detail-text\">This is where recommendations become real: new processes, tooling, or team structure. <strong>Output:</strong> the infrastructure the strategy depends on.</div>\n      </div>\n      <div class=\"fw-row\">\n        <div class=\"fw-num\">04</div>\n        <div><h3>Execute</h3><p class=\"fw-what\">Turn strategy into structured action.</p></div>\n        <div class=\"fw-detail-text\">We work alongside your team through rollout, not from the sidelines. <strong>Output:</strong> the plan in motion, with clear ownership.</div>\n      </div>\n      <div class=\"fw-row\">\n        <div class=\"fw-num\">05</div>\n        <div><h3>Optimize</h3><p class=\"fw-what\">Measure performance and continuously improve.</p></div>\n        <div class=\"fw-detail-text\">We track the metrics that matter and adjust before small issues compound. <strong>Output:</strong> a feedback loop, not a one-time report.</div>\n      </div>\n      <div class=\"fw-row\">\n        <div class=\"fw-num\">06</div>\n        <div><h3>Grow</h3><p class=\"fw-what\">Build stronger capabilities for sustainable growth.</p></div>\n        <div class=\"fw-detail-text\">Growth changes what a business needs next \u2014 so this stage feeds directly back into a fresh Assess. <strong>Output:</strong> a business ready for its next stage.</div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- ENGAGEMENT MODEL -->\n<section class=\"engage\">\n  <div class=\"maxw\">\n    <div class=\"engage-head\">\n      <div class=\"kicker\">Working with be.up</div>\n      <h2>What an engagement actually looks like.</h2>\n      <p>The framework above describes our thinking. Here's the practical sequence of a typical engagement.</p>\n    </div>\n    <div class=\"engage-track\">\n      <div class=\"engage-step\"><div class=\"enum\">Step 1</div><h4>Discovery call</h4><p>A conversation about where your business is today and where it's trying to go.</p></div>\n      <div class=\"engage-step\"><div class=\"enum\">Step 2</div><h4>Diagnostic</h4><p>We assess the relevant capabilities and identify the highest-impact opportunities.</p></div>\n      <div class=\"engage-step\"><div class=\"enum\">Step 3</div><h4>Roadmap proposal</h4><p>A scoped plan with priorities, sequencing, and expected outcomes.</p></div>\n      <div class=\"engage-step\"><div class=\"enum\">Step 4</div><h4>Engagement</h4><p>We work alongside your team through Build, Execute, and Optimize.</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- CTA -->\n<section class=\"app-cta\">\n  <div class=\"maxw\">\n    <h2>Ready to see how this applies to your business?</h2>\n    <p>The first step is a conversation, not a commitment.</p>\n    <a href=\" \"maxw\">\n    <div class=\"svc-list\">\n\n      <div class=\"svc-row\">\n        <div class=\"icon\" style=\"background:rgba(46,125,168,0.12);\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E7DA8\" stroke-width=\"2\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"1\"/><path d=\"M8 20h8M12 16v4\"/></svg></div>\n        <div><h2>IT &amp; Digital</h2><div class=\"tag\">Technology for what's next.</div></div>\n        <div class=\"rcopy\">\n          <p>Technology should support how your business actually operates, not add a second layer of complexity on top of it.</p>\n          <ul>\n            <li>Systems and tooling assessment</li>\n            <li>Integration between disconnected platforms</li>\n            <li>Automation of repetitive processes</li>\n            <li>Data access, controls, and risk basics</li>\n          </ul>\n          <a href=\"/services/it\" class=\"textlink\">Explore IT &amp; Digital <span class=\"arrow\">\u2192</span></a>\n        </div>\n      </div>\n\n      <div class=\"svc-row\">\n        <div class=\"icon\" style=\"background:rgba(31,163,122,0.14);\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1FA37A\" stroke-width=\"2\"><path d=\"M3 17l6-6 4 4 8-8\"/></svg></div>\n        <div><h2>Finance &amp; Performance</h2><div class=\"tag\">Stronger numbers. Better decisions.</div></div>\n        <div class=\"rcopy\">\n          <p>Financial visibility is the foundation every other growth decision depends on.</p>\n          <ul>\n            <li>Revenue, cost, and profitability visibility</li>\n            <li>Budgeting and performance tracking</li>\n            <li>Cash flow monitoring</li>\n            <li>Margin analysis by product, service, or client</li>\n          </ul>\n          <a href=\"/services/finance\" class=\"textlink\">Explore Finance &amp; Performance <span class=\"arrow\">\u2192</span></a>\n        </div>\n      </div>\n\n      <div class=\"svc-row\">\n        <div class=\"icon\" style=\"background:rgba(46,125,168,0.12);\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E7DA8\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><path d=\"M12 8v4l3 3\"/></svg></div>\n        <div><h2>Marketing &amp; Brand Growth</h2><div class=\"tag\">Greater visibility. More opportunities.</div></div>\n        <div class=\"rcopy\">\n          <p>A clear position in the market, communicated consistently, generates demand your sales team can actually convert.</p>\n          <ul>\n            <li>Positioning and value proposition</li>\n            <li>Target customer definition</li>\n            <li>Demand generation activity</li>\n            <li>Marketing measurement and reporting</li>\n          </ul>\n          <a href=\"/services/marketing\" class=\"textlink\">Explore Marketing &amp; Brand Growth <span class=\"arrow\">\u2192</span></a>\n        </div>\n      </div>\n\n      <div class=\"svc-row\">\n        <div class=\"icon\" style=\"background:rgba(31,163,122,0.14);\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1FA37A\" stroke-width=\"2\"><path d=\"M4 4h16v6H4zM4 14h10v6H4z\"/></svg></div>\n        <div><h2>Operations &amp; Process Excellence</h2><div class=\"tag\">Better processes. Higher productivity.</div></div>\n        <div class=\"rcopy\">\n          <p>Growth exposes weak processes fast. We help you build ones that hold up under more demand, not just today's volume.</p>\n          <ul>\n            <li>Process mapping and documentation</li>\n            <li>Bottleneck and inefficiency identification</li>\n            <li>KPI design for operational visibility</li>\n            <li>Scalability planning</li>\n          </ul>\n          <a href=\"/services/operations\" class=\"textlink\">Explore Operations &amp; Process Excellence <span class=\"arrow\">\u2192</span></a>\n        </div>\n      </div>\n\n    </div>\n  </div>\n</section>\n\n<section class=\"svc-cta\">\n  <div class=\"maxw\">\n    <h2>Not sure which capability applies to you?</h2>\n    <p>Take the Business Growth Checkup for a quick read on where your business stands, or talk to a consultant directly.</p>\n    <a href=\"/book-consultation\" class=\"btn btn-primary\">Talk to a Consultant <span class=\"arrow\">\u2192</span></a>\n  </div>\n</section>\n\n<footer>\u00a9 2026 be.up Consultancy. All rights reserved.</footer>\n\n</body>\n</html>\n", "industries": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Industries | be.up Consultancy</title>\n<meta name=\"description\" content=\"be.up works with startups, small and medium businesses, and growing enterprises across industries \u2014 bringing IT, finance, marketing, operations and sales together into one growth system.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --navy:#0B1F3A; --navy-soft:#12294D;\n    --green:#1FA37A; --blue:#2E7DA8;\n    --paper:#F6F5F1; --white:#FFFFFF;\n    --slate:#5B6470; --line:rgba(11,31,58,0.12);\n    --line-dark:rgba(246,245,241,0.14);\n    --maxw:1240px;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:'Inter',sans-serif;color:var(--navy);background:var(--white);line-height:1.5;}\n  h1,h2,h3{font-family:'Manrope',sans-serif;margin:0;letter-spacing:-0.01em;}\n  p{margin:0;}\n  a{color:inherit;text-decoration:none;}\n  .maxw{max-width:var(--maxw);margin:0 auto;padding:0 40px;}\n  section{padding:100px 0;}\n  .kicker{font-size:13px;font-weight:600;color:var(--green);margin-bottom:16px;}\n\n  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:14px 24px;border-radius:4px;cursor:pointer;border:1px solid transparent;}\n  .btn .arrow{display:i ertise and time.</h1>\n    <p>Professional services firms \u2014 consultancies, agencies, legal and accounting practices \u2014 grow differently than product businesses. Revenue is tied to people, utilization, and trust. be.up helps you turn that model into a predictable growth system.</p>\n    <div class=\"ctas\">\n      <a href=\"/contact\" class=\"btn btn-primary\">Talk to a Consultant <span class=\"arrow\">\u2192</span></a>\n      <a href=\"/services\" class=\"btn btn-ghost\">Explore Our Services</a>\n    </div>\n  </div>\n</section>\n\n<!-- CHALLENGES -->\n<section class=\"challenges\">\n  <div class=\"maxw\">\n    <div>\n      <div class=\"kicker\">Common challenges</div>\n      <h2>What typically holds professional services firms back.</h2>\n    </div>\n    <div class=\"challenge-list\">\n      <div class=\"challenge-item\">\n        <h4>Unpredictable pipeline</h4>\n        <p>Revenue depends heavily on referrals and founder relationships rather than a repeatable marketing and sales system.</p>\n      </div>\n      <div class=\"challenge-item\">\n        <h4>Utilization vs. capacity mismatch</h4>\n        <p>Billable time is hard to forecast, making it difficult to plan hiring or investment with confidence.</p>\n      </div>\n      <div class=\"challenge-item\">\n        <h4>Pricing that hasn't kept pace</h4>\n        <p>Rates are often set historically rather than tied to current value delivered or market position.</p>\n      </div>\n      <div class=\"challenge-item\">\n        <h4>Disconnected client data</h4>\n        <p>Client history, proposals, and delivery notes live in separate tools, making performance hard to measure.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- CAPABILITIES MAP -->\n<section>\n  <div class=\"maxw\">\n    <div class=\"cap-head\">\n      <div class=\"kicker\">Relevant be.up capabilities</div>\n      <h2>The three capabilities that matter most here.</h2>\n      <p>All five be.up capabilities are available to every client \u2014 these three are typically where professional services firms see the fastest impact.</p>\n    </div>\n    <div class=\"cap-row\">\n      <div class=\"cap-tag\"><div class=\"dot\" style=\"background:#1FA37A;\"></div><h4>Finance &amp; Performance</h4><p>Utilization tracking, pricing models, and margin visibility by service line.</p></div>\n      <div class=\"cap-tag\"><div class=\"dot\" style=\"background:#1FA37A;\"></div><h4>Marketing &amp; Brand Growth</h4><p>A referral-independent pipeline built on positioning and visibility.</p></div>\n      <div class=\"cap-tag\"><div class=\"dot\" style=\"background:#2E7DA8;\"></div><h4>Operations &amp; Process Excellence</h4><p>Delivery and resourcing processes that scale without adding headcount 1:1.</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- SOLUTIONS -->\n<section class=\"solutions\">\n  <div class=\"maxw\">\n    <div>\n      <div class=\"kicker\">Our solutions</div>\n      <h2>How be.up approaches this.</h2>\n    </div>\n    <div class=\"sol-list\">\n      <div class=\"sol-item\"><div class=\"num\">01</div><div><h4>Pipeline diagnostic</h4><p>Map current lead sources and identify where referral-dependency creates risk.</p></div></div>\n      <div class=\"sol-item\"><div class=\"num\">02</div><div><h4>Utilization and pricing model</h4><p>Build a clear view of margin by service line, client, and team member.</p></div></div>\n      <div class=\"sol-item\"><div class=\"num\">03</div><div><h4>Positioning and visibility plan</h4><p>Develop a marketing system that generates qualified inbound interest.</p></div></div>\n      <div class=\"sol-item\"><div class=\"num\">04</div><div><h4>Delivery process redesign</h4><p>Standardize how work moves from proposal to delivery to reduce dependency on any one person.</p></div></div>\n    </div>\n  </div>\n</section>\n\n<!-- OUTCOMES -->\n<section>\n  <div class=\"maxw\">\n    <div class=\"outcomes-head\">\n      <div class=\"kicker\" style=\"display:flex;justify-content:cent ed-visual\">\n        <svg viewBox=\"0 0 200 140\" width=\"180\" xmlns=\"http://www.w3.org/2000/svg\">\n          <line x1=\"20\" y1=\"110\" x2=\"80\" y2=\"70\" stroke=\"rgba(246,245,241,0.3)\" stroke-width=\"2\"/>\n          <line x1=\"80\" y1=\"70\" x2=\"140\" y2=\"90\" stroke=\"rgba(246,245,241,0.3)\" stroke-width=\"2\"/>\n          <line x1=\"140\" y1=\"90\" x2=\"180\" y2=\"30\" stroke=\"rgba(246,245,241,0.3)\" stroke-width=\"2\"/>\n          <circle cx=\"20\" cy=\"110\" r=\"6\" fill=\"#2E7DA8\"/><circle cx=\"80\" cy=\"70\" r=\"6\" fill=\"#F6F5F1\"/>\n          <circle cx=\"140\" cy=\"90\" r=\"6\" fill=\"#2E7DA8\"/><circle cx=\"180\" cy=\"30\" r=\"8\" fill=\"#1FA37A\"/>\n        </svg>\n      </div>\n      <div class=\"featured-body\">\n        <span class=\"cat-tag\">Strategy</span>\n        <h2>Why Your Business Functions Keep Working Against Each Other</h2>\n        <p>Marketing generates leads sales can't close. Finance flags a margin problem operations didn't see coming. It's rarely a people problem \u2014 it's a structural one.</p>\n        <div class=\"meta-row\"><span>be.up Editorial</span><span class=\"dot\"></span><span>7 min read</span><span class=\"dot\"></span><span>Sep 2026</span></div>\n        <a href=\"/insights/business-functions-working-against-each-other\" class=\"textlink\">Read the article <span class=\"arrow\">\u2192</span></a>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section style=\"padding-top:0;\">\n  <div class=\"maxw\">\n    <div class=\"article-grid\">\n\n      <div class=\"article-card\">\n        <div class=\"article-visual\"><svg width=\"60\" height=\"60\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E7DA8\" stroke-width=\"1.5\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"1\"/><path d=\"M8 20h8M12 16v4\"/></svg></div>\n        <div class=\"article-body\">\n          <span class=\"cat-tag\" style=\"color:#2E7DA8;\">IT &amp; Digital</span>\n          <h3>Your Systems Don't Need to Be Fancier. They Need to Talk to Each Other.</h3>\n          <p>Most small and mid-sized businesses don't have a technology problem \u2014 they have an integration problem.</p>\n          <div class=\"article-meta\">5 min read \u00b7 Aug 2026</div>\n        </div>\n      </div>\n\n      <div class=\"article-card\">\n        <div class=\"article-visual\"><svg width=\"60\" height=\"60\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1FA37A\" stroke-width=\"1.5\"><path d=\"M3 17l6-6 4 4 8-8\"/></svg></div>\n        <div class=\"article-body\">\n          <span class=\"cat-tag\">Finance</span>\n          <h3>The Margin Question Most Businesses Can't Answer</h3>\n          <p>If you can't say which clients or products actually drive profit, pricing decisions are guesses.</p>\n          <div class=\"article-meta\">6 min read \u00b7 Aug 2026</div>\n        </div>\n      </div>\n\n      <div class=\"article-card\">\n        <div class=\"article-visual\"><svg width=\"60\" height=\"60\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E7DA8\" stroke-width=\"1.5\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><path d=\"M12 8v4l3 3\"/></svg></div>\n        <div class=\"article-body\">\n          <span class=\"cat-tag\" style=\"color:#2E7DA8;\">Marketing</span>\n          <h3>Referrals Aren't a Growth Strategy. They're a Risk.</h3>\n          <p>A pipeline built entirely on word of mouth is a pipeline you don't control.</p>\n          <div class=\"article-meta\">4 min read \u00b7 Jul 2026</div>\n        </div>\n      </div>\n\n      <div class=\"article-card\">\n        <div class=\"article-visual\"><svg width=\"60\" height=\"60\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1FA37A\" stroke-width=\"1.5\"><path d=\"M4 4h16v6H4zM4 14h10v6H4z\"/></svg></div>\n        <div class=\"article-body\">\n          <span class=\"cat-tag\">Operations</span>\n          <h3>What Breaks First When a Business Grows Too Fast</h3>\n          <p>Growth doesn't strain the business evenly \u2014 it finds the weakest process and breaks it first.</p>\n          <div class=\"article-meta\">6 min read \u00b7 Jul 2026</div>\n        </div>\n      </div>\n\n      <div class=\"article-card\">\n        <div class=\"article-visual\"><svg width=\"60\" height=\"60\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E7DA8\" stroke-width=\"1.5\"><path d=\"M3 3v18h18M7 15l4-4 3 3 5-6\"/></svg></div>\n        <div class=\"article-body\">\n          <span class=\"cat-tag\" style=\"color:#2E7DA8;\">Sales</span>\n          <h3>Why Good Salespeople Still Miss Targets</h3>\n          <p>Often it isn't skill. It's a pipeline with no defined stages and no consistent follow-up.</p>\n          <div class=\"article-meta\">5 min read \u00b7 Jun 2026</div>\n        </div>\n      </div>\n\n      <div class=\"article-card\">\n        <div class=\"article-visual\"><svg width=\"60\" height=\"60\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1FA37A\" stroke-width=\"1.5\"><path d=\"M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5c2 0 3.5 1.5 5.5 4 2-2.5 3.5-4 5.5-4C21 5 23.5 8.5 21.5 12.5 19 16.65 12 21 12 21z\"/></svg></div>\n        <div class=\"article-body\">\n          <span class=\"cat-tag\">Strategy</span>\n          <h3>A Strategy Nobody Can Explain in One Sentence Isn't a Strategy</h3>\n          <p>If your team can't state the priority for the next year in a sentence, they can't execute it either.</p>\n          <div class=\"article-meta\">5 min read \u00b7 Jun 2026</div>\n        </div>\n      </div>\n\n    </div>\n  </div>\n</section>\n\n<section class=\"ins-cta\">\n  <div class=\"maxw\">\n    <h2>Want perspective specific to your business, not a general article?</h2>\n    <p>The fastest way to get a specific answer is a conversation.</p>\n    <a href=\"/book-consultation\" class=\"btn btn-primary\">Talk to a Consultant <span class=\"arrow\">\u2192</span></a>\n  </div>\n</section>\n\n<footer>\u00a9 2026 be.up Consultancy. All rights reserved.</footer>\n\n</body>\n</html>\n", "insights-article": "<!DOCTYPE html>\n<html lang=\"en\">\ s=\"btn btn-primary\" style=\"padding:11px 18px;font-size:14px;\">Talk to a Consultant</a>\n  </div>\n</header>\n\n<div class=\"maxw breadcrumb\"><a href=\"/\">Home</a><span class=\"sep\">/</span><a href=\"/insights\">Insights</a><span class=\"sep\">/</span>Article</div>\n\n<section class=\"article-head\">\n  <div class=\"narrow\">\n    <span class=\"cat-tag\">Strategy</span>\n    <h1>Why Your Business Functions Keep Working Against Each Other</h1>\n    <div class=\"meta-row\"><span>7 min read</span><span class=\"dot\"></span><span>September 2026</span></div>\n    <div class=\"author-row\">\n      <div class=\"author-photo\">Photo</div>\n      <div>\n        <div class=\"author-name\">be.up Editorial</div>\n        <div class=\"author-role\">Author bio to be replaced with a named consultant before launch</div>\n      </div>\n    </div>\n    <div class=\"hero-visual\">\n      <svg viewBox=\"0 0 260 160\" width=\"220\" xmlns=\"http://www.w3.org/2000/svg\">\n        <line x1=\"20\" y1=\"130\" x2=\"90\" y2=\"80\" stroke=\"rgba(246,245,241,0.3)\" stroke-width=\"2\"/>\n        <line x1=\"90\" y1=\"80\" x2=\"160\" y2=\"110\" stroke=\"rgba(246,245,241,0.3)\" stroke-width=\"2\"/>\n        <line x1=\"160\" y1=\"110\" x2=\"240\" y2=\"30\" stroke=\"rgba(246,245,241,0.3)\" stroke-width=\"2\"/>\n        <circle cx=\"20\" cy=\"130\" r=\"7\" fill=\"#2E7DA8\"/><circle cx=\"90\" cy=\"80\" r=\"7\" fill=\"#F6F5F1\"/>\n        <circle cx=\"160\" cy=\"110\" r=\"7\" fill=\"#2E7DA8\"/><circle cx=\"240\" cy=\"30\" r=\"9\" fill=\"#1FA37A\"/>\n      </svg>\n    </div>\n  </div>\n</section>\n\n<section style=\"padding-top:24px;\">\n  <div class=\"narrow article-body\">\n    <p>Most conflict between departments doesn't come from personality clashes or bad intent. It comes from the fact that marketing, sales, operations, finance, and IT are usually measured, planned, and rewarded as if they were separate businesses \u2014 when the outcome each of them is chasing only exists because of the others.</p>\n\n    <p>You can see it in three familiar patterns:</p>\n\n    <ul>\n      <li><strong>Marketing hits its lead target, sales misses its revenue target.</strong> The leads were real, but they didn't match what sales could actually convert \u2014 because no one connected the two targets to begin with.</li>\n      <li><strong>Finance reports a margin problem, operations is the last to hear about it.</strong> By the time the numbers surface the issue, the process decisions that caused it were made months earlier.</li>\n      <li><strong>IT builds the system leadership asked for, and nobody adopts it.</strong> The requirements came from one function's view of the problem, not from how the work actually flows across the business.</li>\n    </ul>\n\n    <h2>The pattern behind the pattern</h2>\n    <p>Each of these looks like a different problem \u2014 a targeting issue, a reporting delay, an adoption failure. But they share a root cause: decisions are made inside a function, then handed to the next function as a finished plan rather than a shared one.</p>\n\n    <p>This isn't a failure of any individual team. It's what happens by default when a business grows past the point where one person can hold the whole picture in their head. Priorities that made sense from inside Marketing stop making sense once they reach Sales, because Sales was never in the room when they were set.</p>\n\n    <div class=\"pull-quote\">The fix isn't more meetings between departments. It's designing decisions so the downstream function's constraints are part of the input, not a surprise at the output.</div>\n\n    <h2>What this looks like in practice</h2>\n    <p>Three shifts tend to matter more than any org chart change:</p>\n    <ul>\n      <li><strong>Shared targets, not adjacent targets.</strong> A lead-volume goal and a revenue goal should be derived from the same number, not set independently and reconciled later.</li>\n      <li><strong>Earlier visibility, not faster reporting.</strong> A finance dashboard that surfaces a margin problem sooner doesn't help if operations still finds out after the fact. The information needs to reach the function that can act on it before the decision is locked in.</li>\n      <li><strong>Requirements gathered from the workflow, not the department.</strong> A system built around how work actually moves between teams gets adopted. A system built around one team's wish list usually doesn't.</li>\n    </ul>\n\n    <p>None of this requires a reorganization. It requires treating the business as one connected system when decisions are made \u2014 not just when results are reviewed.</p>\n\n    <div class=\"article-cta\">\n      <h3>Recognize this pattern in your own business?</h3>\n      <p>A short conversation is usually enough to see where the disconnect actually sits.</p>\n      <div class=\"ctas\">\n        <a href=\"/book-consultation\" class=\"btn btn-primary\">Talk to a Consultant <span class=\"arrow\">\u2192</span></a>\n        <a href=\"/approach\" class=\"btn btn-ghost\">Explore Our Approach</a>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section class=\"related\">\n  <div class=\"maxw\">\n    <h2>Related reading</h2>\n    <div class=\"related-grid\">\n      <div class=\"related-card\">\n        <div class=\"rcat\">IT &amp; Digital</div>\n        <h3>Your Systems Don't Need to Be Fancier. They Need to Talk to Each Other.</h3>\n        <div class=\"rmeta\">5 min read \u00b7 Aug 2026</div>\n      </div>\n      <div class=\"related-card\">\n        <div class=\"rcat\">Operations</div>\n        <h3>What Breaks First When a Business Grows Too Fast</h3>\n        <div class=\"rmeta\">6 min read \u00b7 Jul 2026</div>\n      </div>\n      <div class=\"related-card\">\n        <div class=\"rcat\">Strategy</div>\n        <h3>A Strategy Nobody Can Explain in One Sentence Isn't a Strategy</h3>\n        <div class=\"rmeta\">5 min read \u00b7 Jun 2026</div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<footer>\u00a9 2026 be.up Consultancy. All rights reserved.</footer>\n\n</body>\n</html>\n", "contact": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Contact | be.up Consultancy</title>\n<meta name=\"description\" content=\"Get in touch with be.up Consultancy. Talk to a consultant about your business, or book a consultation directly.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --navy:#0B1F3A; --navy-soft:#12294D;\n    --green:#1FA37A; --blue:#2E7DA8;\n    --paper:#F6F5F1; --white:#FFFFFF;\n    --slate:#5B6470; --line:rgba(11,31,58,0.12);\n    --danger:#B3402F;\n    --maxw:1240px;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:'Inter',sans-serif;color:var(--navy);background:var(--white);line-height:1.5;}\n  h1,h2,h3{font-family:'Manrope',sans-serif;margin:0;letter-spacing:-0.01em;}\n  p{margin:0;}\n  a{color:inherit;text-decoration:none;}\n  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}\n  .maxw{max-width:var(--maxw);margin:0 auto;padding:0 40px;}\n  section{padding:96px 0;}\n  .kicker{font-size:13px;font-weight:600;color:var(--green);margin-bottom:16px;}\n\n  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:14px 24px;border-radius:4px;cursor:pointer;border:1px solid transparent;font-family:'Inter',sans-serif;}\n  .btn .arrow{transition:transform .15s ease;}\n  .btn:hover .arrow{transform:translateX(4px);}\n  .btn-primary{background:var(--green);color:var(--navy);}\n  .btn-ghost{border:1px solid var(--line);color:var(--navy);background:transparent;}\n\n  header{padding:20px 0;border-bottom:1px solid var(--line);}\n  header .maxw{display:flex;align-items:center;justify-content:space-between;}\n  nav{display  class=\"contact-hero\">\n  <div class=\"maxw\">\n    <div class=\"kicker\">Contact</div>\n    <h1>Let's talk about your business.</h1>\n    <p>Whether you're ready to book a consultation or just have a question first, here's how to reach be.up.</p>\n  </div>\n</section>\n\n<section style=\"padding-top:0;\">\n  <div class=\"maxw\">\n    <div class=\"contact-grid\">\n\n      <div>\n        <div class=\"path-card\">\n          <h3>Not sure yet?</h3>\n          <p>Take the 2\u20133 minute Business Growth Checkup first to see where your business might need attention.</p>\n          <a href=\"/business-growth-checkup\" class=\"btn btn-ghost\">Take the Checkup <span class=\"arrow\">\u2192</span></a>\n        </div>\n        <div class=\"path-card\">\n          <h3>Direct contact</h3>\n          <div class=\"info-row\"><span class=\"il\">Email</span><span class=\"iv\"><a href=\"mailto:hello@beup.co\">hello@beup.co</a></span></div>\n          <div class=\"info-row\"><span class=\"il\">LinkedIn</span><span class=\"iv\"><a href=\"#\">be.up Consultancy</a></span></div>\n        </div>\n      </div>\n\n      <div class=\"form-card\" id=\"form-wrap\">\n        <div id=\"form-view\">\n          <h2>Or send us a message</h2>\n          <form id=\"contact-form\" novalidate>\n            <div class=\"two-col\">\n              <div class=\"field\" data-field=\"name\">\n                <label for=\"c-name\">Full name</label>\n                <input type=\"text\" id=\"c-name\">\n                <div class=\"err\">Enter your name.</div>\n              </div>\n              <div class=\"field\" data-field=\"company\">\n                <label for=\"c-company\">Company</label>\n                <input type=\"text\" id=\"c-company\">\n                <div class=\"err\">Enter your company name.</div>\n              </div>\n            </div>\n            <div class=\"field\" data-field=\"email\">\n              <label for=\"c-email\">Work email</label>\n              <input type=\"email\" id=
