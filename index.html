p": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Business Growth Checkup | be.up Consultancy</title>\n<meta name=\"description\" content=\"Quickly assess key areas of your business and identify potential opportunities to strengthen performance and support sustainable growth.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --navy:#0B1F3A; --navy-soft:#12294D;\n    --green:#1FA37A; --blue:#2E7DA8;\n    --paper:#F6F5F1; --white:#FFFFFF;\n    --slate:#5B6470; --line:rgba(11,31,58,0.14);\n    --danger:#B3402F;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:'Inter',sans-serif;color:var(--navy);background:var(--paper);line-height:1.5;}\n  h1,h2,h3{font-family:'Manrope',sans-serif;margin:0;letter-spacing:-0.01em;}\n  p{margin:0;}\n  a{color:inherit;}\n  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}\n\n  .topbar{background:var(--navy);color:var(--white);padding:18px 24px;text-align:center;font-size:13px;font-weight:600;letter-spacing:0.03em;}\n  .wrap{max-width:640px;margin:0 auto;padding:56px 20px 80px;}\n\n  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:14px 26px;border-radius:4px;cursor:pointer;border:1px solid transparent;font-family:'Inter',sans-serif;}\n  .btn .arrow{transition:transform .15s ease;}\n  .btn:hover .arrow{transform:translateX(4px);}\n  .btn-primary{background:var(--green);color:var(--navy);}\n  .btn-primary:disabled{opacity:0.45;cursor:not-allowed;}\n  .btn-primary:disabled .arrow{transform:none;}\n  .btn-ghost{background:transparent;color:var(--navy);border-color:var(--line);}\n\n  /* INTRO */\n  .card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:48px 40px;}\n  .kicker{font-size:13px;font-weight:600;color:var(--green);margin-bottom:14px;}\n  .intro h1{font-size:32px;font-weight:700;line-height:1.2;}\n  .intro p.sub{margin-top:16px;font-size:16px;color:var(--slate);line-height:1.65;}\n  .intro .meta{margin-top:24px;font-size:13px;color:var(--slate);}\n  .intro .ctas{margin-top:32px;}\n  .why-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:40px;}\n  .why-card{border:1px solid var(--line);border-radius:6px;padding:20px;}\n  .why-card h3{font-size:14px;font-weight:700;margin-bottom:6px;}\n  .why-card p{font-size:13px;color:var(--slate);line-height:1.5;}\n\n  /* PROGRESS */\n  .progress-wrap{margin-bottom:32px;}\n  .progress-top{display:flex;justify-content:space-between;font-size:13px;color:var(--slate);margin-bottom:10px;font-weight:600;}\n  .progress-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;}\n  .progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .35s ease;}\n  .area-label{font-size:12px;font-weight:600;color:var(--blue);margin-top:10px;text-transform:none;}\n\n  /* QUESTION */\n  .qcard{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:44px 40px;}\n  .qtext{font-size:22px;font-weight:700;line-height:1.35;margin-bottom:32px;}\n  .qtext.animate{animation:qin .35s ease;}\n  @keyframes qin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}\n  @media (prefers-reduced-motion:reduce){.qtext.animate{animation:none;}}\n\n  .answer-group{display:flex;flex-direction:column;gap:12px;}\n  .answer-btn{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1.5px solid var(--line);border-radius:8px;background:var(--white);cursor:pointer;font-family:'Inter',sans-serif;text-align:left;transition:border-color .15s ease,background .15s ease;min-height:56px;}\n  .answer-btn:hover{border-color:var(--blue);}\n  .answer-btn[aria-checked=\"true\"]{border-color:var(--green);background:rgba(31,163,122,0.06);}\n  .answer-btn .check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;position:relative;}\n  .answer-btn[aria-checked=\"true\"] .check{border-color:var(--green);}\n  .answer-btn[aria-checked=\"true\"] .check::after{content:\"\";position:absolute;inset:3px;border-radius:50%;background:var(--green);}\n  .answer-btn .alabel{font-size:16px;font-weight:600;}\n  .answer-btn .asub{font-size:13px;color:var(--slate);margin-top:2px;}\n\n  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:36px;}\n  .back-link{font-size:14px;font-weight:600;color:var(--slate);cursor:pointer;background:none;border:none;padding:8px;font-family:'Inter',sans-serif;}\n  .back-link:disabled{opacity:0;pointer-events:none;}\n\n  /* LEAD FORM */\n  .lead-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:44px 40px;}\n  .lead-card h2{font-size:26px;font-weight:700;}\n  .lead-card p.sub{margin-top:12px;font-size:15px;color:var(--slate);line-height:1.6;}\n  .field{margin-top:22px;}\n  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;}\n  .field input,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:6px;font-family:'Inter',sans-serif;font-size:15px;color:var(--navy);}\n  .field input:focus,.field select:focus{border-color:var(--blue);}\n  .field .err{color:var(--danger);font-size:13px;margin-top:6px;display:none;}\n  .field.invalid input,.field.invalid select{border-color:var(--danger);}\n  .field.invalid .err{display:block;}\n  .consent{display:flex;gap:10px;margin-top:24px;align-items:flex-start;}\n  .consent input{margin-top:3px;}\n  .consent label{font-size:13px;color:var(--slate);line-height:1.5;}\n  .privacy-link{font-size:13px;color:var(--blue);font-weight:600;display:inline-block;margin-top:14px;}\n  .lead-card .ctas{margin-top:28px;}\n\n  /* RESULTS */\n  .results-hero{text-align:center;padding:8px 0 40px;}\n  .results-hero .kicker{justify-content:center;display:flex;}\n  .results-hero h1{font-size:30px;font-weight:700;}\n  .score-panel{background:var(--navy);color:var(--white);border-radius:10px;padding:40px;text-align:center;margin-bottom:40px;}\n  .score-panel .scoreval{font-size:52px;font-weight:800;font-family:'Manrope',sans-serif;}\n  .score-panel .scoreval span{font-size:22px;font-weight:600;color:rgba(246,245,241,0.6);}\n  .score-panel .profile-tag{display:inline-block;margin-top:16px;background:var(--green);color:var(--navy);font-size:13px;font-weight:700;padding:8px 18px;border-radius:20px;}\n  .score-panel p.desc{margin-top:18px;font-size:14px;color:rgba(246,245,241,0.65);max-width:440px;margin-left:auto;margin-right:auto;line-height:1.6;}\n\n  .area-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:48px;}\n  .area-card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:22px;opacity:0;transform:translateY(10px);animation:cardin .5s ease forwards;}\n  @keyframes cardin{to{opacity:1;transform:translateY(0);}}\n  @media (prefers-reduced-motion:reduce){.area-card{animation:none;opacity:1;transform:none;}}\n  .area-card .aname{font-size:14px;font-weight:700;margin-bottom:8px;}\n  .area-card .aresult{font-size:13px;font-weight:700;padding:4px 10px;border-radius:4px;display:inline-block;}\n  .aresult.strong{background:rgba(31,163,122,0.14);color:#0F6E56;}\n  .aresult.developing{background:rgba(46,125,168,0.14);color:#0C447C;}\n  .aresult.improvement{background:rgba(179,64,47,0.12);color:#791F1F;}\n\n  .callout{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:32px;margin-bottom:24px;}\n  .callout .ckicker{font-size:13px;font-weight:600;margin-bottom:12px;}\n  .callout.priority .ckicker{color:var(--danger);}\n  .callout.strength .ckicker{color:var(--green);}\n  .callout h3{font-size:20px;font-weight:700;margin-bottom:10px;}\n  .callout p{font-size:15px;color:var(--slate);line-height:1.65;}\n  .callout .textlink{margin-top:16px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--navy);}\n  .callout .textlink .arrow{transition:transform .15s ease;}\n  .callout .textlink:hover .arrow{transform:translateX(4px);}\n\n  .final-cta{background:var(--navy);color:var(--white);border-radius:10px;padding:44px 36px;text-align:center;margin-top:40px;}\n  .final-cta h2{font-size:24px;font-weight:700;}\n  .final-cta p{margin:14px auto 24px;max-width:400px;font-size:15px;color:rgba(246,245,241,0.68);line-height:1.6;}\n  .final-cta .ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}\n  .btn-ghost.on-dark{color:var(--white);border-color:rgba(246,245,241,0.25);}\n\n  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}\n\n  @media (max-width:600px){\n    .wrap{padding:32px 16px 64px;}\n    .card,.qcard,.lead-card{padding:28px 22px;}\n    .why-grid{grid-template-columns:1fr;}\n    .area-grid{grid-template-columns:1fr;}\n    .intro h1{font-size:26px;}\n    .qtext{font-size:19px;}\n  }\n</style>\n</head>\n<body>\n\n<div class=\"topbar\">BE.UP BUSINESS GROWTH CHECKUP</div>\n<div class=\"wrap\" id=\"app\"></div>\n<div aria-live=\"polite\" class=\"sr-only\" id=\"live-region\"></div>\n\n<script>\nconst AREAS = {\n  strategy:{name:'Strategy & Leadership'},\n  it:{name:'IT & Digital'},\n  finance:{name:'Finance & Performance'},\n  marketing:{name:'Marketing & Brand Growth'},\n  operations:{name:'Operations & Process Excellence'},\n  sales:{name:'Sales & Revenue Growth'}\n};\nconst QUESTIONS = [\n  {id:1,area:'strategy',text:'Does your business have clear priorities for the next 12\u201324 months?'},\n  {id:2,area:'strategy',text:'Do you regularly measure progress against your business goals?'},\n  {id:3,area:'it',text:'Do your technology and digital systems effectively support your business?'},\n  {id:4,area:'it',text:'Can your team easily access the information and tools they need to work effectively?'},\n  {id:5,area:'finance',text:'Do you have clear visibility into your revenue, costs and profitability?'},\n  {id:6,area:'finance',text:'Do you regularly use financial information to make business decisions?'},\n  {id:7,area:'marketing',text:'Do you have a clear understanding of your target customers and market position?'},\n  {id:8,area:'marketing',text:'Do you know which marketing activities are generating results?'},\n  {id:9,area:'operations',text:'Are your key business processes clearly defined and consistently followed?'},\n  {id:10,area:'operations',text:'Can your operations handle increased demand without major disruption?'},\n  {id:11,area:'sales',text:'Do you have a clear and repeatable sales process?'},\n  {id:12,area:'sales',text:'Do you consistently track leads, opportunities and sales performance?'}\n];\nconst OPTIONS = [\n  {value:2,label:'Yes',sub:'This is true for our business'},\n  {value:1,label:'Partly',sub:'True in some ways, not fully'},\n  {value:0,label:'No',sub:'Not currently true for us'}\n];\n\nlet state = { screen:'intro', qIndex:0, answers:{}, lead:{} };\nconst app = document.getElementById('app');\nconst live = document.getElementById('live-region');\n\nfunction announce(msg){ live.textContent = msg; }\n\nfunction render(){\n  if(state.screen==='intro') renderIntro();\n  else if(state.screen==='question') renderQuestion();\n  else if(state.screen==='lead') renderLead();\n  else if(state.screen==='results') renderResults();\n  window.scrollTo({top:0,behavior:'auto'});\n}\n\nfunction renderIntro(){\n  app.innerHTML = `\n    <div class=\"card intro\">\n      <div class=\"kicker\">be.up Business Growth Checkup</div>\n      <h1>Is Your Business Ready for Its Next Stage?</h1>\n      <p class=\"sub\">Take a quick look at the key areas that influence business performance and growth. Identify potential strengths, gaps, and priorities in just a few minutes.</p>\n      <div class=\"meta\">Takes approximately 2\u20133 minutes.</div>\n      <div class=\"ctas\">\n        <button class=\"btn btn-primary\" id=\"start-btn\">Start Your Checkup <span class=\"arrow\">\u2192</span></button>\n      </div>\n      <div class=\"why-grid\">\n        <div class=\"why-card\"><h3>Understand</h3><p>Identify areas that may be supporting or limiting your growth.</p></div>\n        <div class=\"why-card\"><h3>Prioritize</h3><p>See where improvement could have the greatest business impact.</p></div>\n        <div class=\"why-card\"><h3>Move Forward</h3><p>Use your results to determine practical next steps.</p></div>\n      </div>\n    </div>\n  `;\n  document.getElementById('start-btn').addEventListener('click', ()=>{\n    state.screen='question'; state.qIndex=0; render();\n  });\n}\n\nfunction renderQuestion(){\n  const q = QUESTIONS[state.qIndex];\n  const total = QUESTIONS.length;\n  const pct = Math.round(((state.qIndex)/total)*100);\n  const selected = state.answers[q.id];\n  app.innerHTML = `\n    <div class=\"progress-wrap\">\n      <div class=\"progress-top\"><span>Question ${state.qIndex+1} of ${total}</span><span>${pct}% Complete</span></div>\n      <div class=\"progress-track\"><div class=\"progress-fill\" style=\"width:${pct}%\"></div></div>\n      <div class=\"area-label\">${AREAS[q.area].name}</div>\n    </div>\n    <div class=\"qcard\">\n      <div class=\"qtext animate\" id=\"qtext\">${q.text}</div>\n      <div class=\"answer-group\" role=\"radiogroup\" aria-label=\"${q.text}\">\n        ${OPTIONS.map(o=>`\n          <button type=\"button\" class=\"answer-btn\" role=\"radio\" aria-checked=\"${selected===o.value}\" data-value=\"${o.value}\">\n            <span class=\"check\" aria-hidden=\"true\"></span>\n            <span><span class=\"alabel\">${o.label}</span><div class=\"asub\">${o.sub}</div></span>\n          </button>\n        `).join('')}\n      </div>\n      <div class=\"nav-row\">\n        <button class=\"back-link\" id=\"back-btn\" ${state.qIndex===0 ? 'disabled' : ''}>\u2190 Back</button>\n        <button class=\"btn btn-primary\" id=\"next-btn\" ${selected===undefined ? 'disabled' : ''}>\n          ${state.qIndex===total-1 ? 'See My Results' : 'Next'} <span class=\"arrow\">\u2192</span>\n        </button>\n      </div>\n    </div>\n  `;\n  document.querySelectorAll('.answer-btn').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      state.answers[q.id] = parseInt(btn.dataset.value,10);\n      renderQuestion();\n      announce(`Selected ${btn.querySelector('.alabel').textContent}`);\n    });\n  });\n  document.getElementById('back-btn').addEventListener('click', ()=>{\n    if(state.qIndex>0){ state.qIndex--; render(); }\n  });\n  document.getElementById('next-btn').addEventListener('click', ()=>{\n    if(state.answers[q.id]===undefined) return;\n    if(state.qIndex < total-1){ state.qIndex++; render(); }\n    else { state.screen='lead'; render(); }\n  });\n}\n\nfunction renderLead(){\n  app.innerHTML = `\n    <div class=\"lead-card\">\n      <div class=\"kicker\">Almost there</div>\n      <h2>Your checkup is complete.</h2>\n      <p class=\"sub\">Enter your details to see your complete Business Growth Snapshot and recommended next steps.</p>\n      <form id=\"lead-form\" novalidate>\n        <div class=\"field\" data-field=\"name\">\n          <label for=\"f-name\">Full name</label>\n          <input type=\"text\" id=\"f-name\" autocomplete=\"name\">\n          <div class=\"err\">Enter your name.</div>\n        </div>\n        <div class=\"field\" data-field=\"company\">\n          <label for=\"f-company\">Company name</label>\n          <input type=\"text\" id=\"f-company\" autocomplete=\"organization\">\n          <div class=\"err\">Enter your company name.</div>\n        </div>\n        <div class=\"field\" data-field=\"email\">\n          <label for=\"f-email\">Work email</label>\n          <input type=\"email\" id=\"f-email\" autocomplete=\"email\">\n          <div class=\"err\">Enter a valid email address.</div>\n        </div>\n        <div class=\"field\" data-field=\"phone\">\n          <label for=\"f-phone\">Phone <span style=\"color:var(--slate);font-weight:400;\">(optional)</span></label>\n          <input type=\"tel\" id=\"f-phone\" autocomplete=\"tel\">\n        </div>\n        <div class=\"consent\">\n          <input type=\"checkbox\" id=\"f-consent\">\n          <label for=\"f-consent\">I agree to be contacted regarding my checkup and potential business consulting requirements.</label>\n        </div>\n        <div class=\"field\" data-field=\"consent\" style=\"margin-top:0;\"><div class=\"err\">Please confirm you agree to be contacted.</div></div>\n        <div class=\"ctas\">\n          <button type=\"submit\" class=\"btn btn-primary\">See My Results <span class=\"arrow\">\u2192</span></button>\n        </div>\n        <a href=\"/privacy\" class=\"privacy-link\">Privacy Policy</a>\n      </form>\n    </div>\n  `;\n  document.getElementById('lead-form').addEventListener('submit', (e)=>{\n    e.preventDefault();\n    const name = document.getElementById('f-name').value.trim();\n    const company = document.getElementById('f-company').value.trim();\n    const email = document.getElementById('f-email').value.trim();\n    const consent = document.getElementById('f-consent').checked;\n    let valid = true;\n    const setInvalid = (field, ok) => {\n      const el = document.querySelector(`.field[data-field=\"${field}\"]`);\n      el.classList.toggle('invalid', !ok);\n      if(!ok) valid = false;\n    };\n    setInvalid('name', name.length>0);\n    setInvalid('company', company.length>0);\n    setInvalid('email', /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email));\n    setInvalid('consent', consent);\n    if(!valid){ announce('Please correct the highlighted fields.'); return; }\n    state.lead = { name, company, email, phone: document.getElementById('f-phone').value.trim() };\n    state.screen='results'; render();\n  });\n}\n\nfunction computeResults(){\n  const areaScores = {};\n  Object.keys(AREAS).forEach(k=>areaScores[k]=0);\n  let total = 0;\n  QUESTIONS.forEach(q=>{\n    const v = state.answers[q.id] ?? 0;\n    areaScores[q.area]+=v;\n    total+=v;\n  });\n  const areaLabel = (score)=>{\n    if(score===4) return {label:'Strong', cls:'strong'};\n    if(score>=2) return {label:'Developing', cls:'developing'};\n    return {label:'Improvement Opportunity', cls:'improvement'};\n  };\n  const areaResults = Object.entries(areaScores).map(([key,score])=>({\n    key, name:AREAS[key].name, score, ...areaLabel(score)\n  }));\n  const sorted = [...areaResults].sort((a,b)=>a.score-b.score);\n  const priority = sorted[0];\n  const strength = sorted[sorted.length-1];\n\n  let profile;\n  if(total>=19) profile = {label:'Strong Foundation', desc:'Your responses indicate that your business has several strong foundations in place. Your next opportunity may be to improve integration, consistency and performance as you grow.'};\n  else if(total>=13) profile = {label:'Developing Foundation', desc:'Your business has positive foundations, but there are areas where greater structure or consistency could support stronger performance.'};\n  else if(total>=7) profile = {label:'Improvement Opportunity', desc:'Your responses highlight several areas that may benefit from focused attention, stronger systems or clearer processes.'};\n  else profile = {label:'Priority Attention', desc:'Your responses suggest that several foundational areas may need attention before your business can confidently support its next stage of growth.'};\n\n  return { total, areaResults, priority, strength, profile };\n}\n\nfunction renderResults(){\n  const r = computeResults();\n  app.innerHTML = `\n    <div class=\"results-hero\">\n      <div class=\"kicker\">Your be.up Business Growth Checkup</div>\n      <h1>Your Business Growth Snapshot</h1>\n    </div>\n    <div class=\"score-panel\">\n      <div style=\"font-size:13px;font-weight:600;color:rgba(246,245,241,0.6);margin-bottom:8px;\">Your score</div>\n      <div class=\"scoreval\">${r.total}<span> / 24</span></div>\n      <div class=\"profile-tag\">${r.profile.label.toUpperCase()}</div>\n      <p class=\"desc\">${r.profile.desc}</p>\n    </div>\n\n    <div class=\"area-grid\">\n      ${r.areaResults.map((a,i)=>`\n        <div class=\"area-card\" style=\"animation-delay:${i*70}ms\">\n          <div class=\"aname\">${a.name}</div>\n          <span class=\"aresult ${a.cls}\">${a.label}</span>\n        </div>\n      `).join('')}\n    </div>\n\n    <div class=\"callout priority\">\n      <div class=\"ckicker\">WHERE SHOULD YOU FOCUS FIRST?</div>\n      <h3>${r.priority.name}</h3>\n      <p>Your responses indicate that ${r.priority.name} may deserve closer attention. Strengthening this area could help create a stronger foundation for consistent business performance.</p>\n      <a href=\"/services\" class=\"textlink\">Explore ${r.priority.name} <span class=\"arrow\">\u2192</span></a>\n    </div>\n\n    <div class=\"callout strength\">\n      <div class=\"ckicker\">WHAT'S WORKING WELL?</div>\n      <h3>${r.strength.name}</h3>\n      <p>Your strongest area is ${r.strength.name}. This is a solid foundation to build on as you address other priorities.</p>\n    </div>\n\n    <div class=\"final-cta\">\n      <h2>Ready to Move Your Business Up?</h2>\n      <p>Your checkup is a starting point. If you'd like to understand the opportunities behind your results, talk with be.up about your business.</p>\n      <div class=\"ctas\">\n        <a href=\"/contact\" class=\"btn btn-primary\">Talk to a Consultant <span class=\"arrow\">\u2192</span></a>\n        <a href=\"/approach\" class=\"btn btn-ghost on-dark\">Explore Our Approach</a>\n      </div>\n    </div>\n  `;\n}\n\nrender();\n<\/script>\n\n</body>\n</html>\n", "book": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Book a Consultation | be.up Consultancy</title>\n<meta name=\"description\" content=\"Book a consultation with be.up. Tell us about your business, choose what you'd like to discuss, and pick a time that works for you.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --navy:#0B1F3A; --navy-soft:#12294D;\n    --green:#1FA37A; --blue:#2E7DA8;\n    --paper:#F6F5F1; --white:#FFFFFF;\n    --slate:#5B6470; --line:rgba(11,31,58,0.14);\n    --danger:#B3402F;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:'Inter',sans-serif;color:var(--navy);background:var(--paper);line-height:1.5;}\n  h1,h2,h3{font-family:'Manrope',sans-serif;margin:0;letter-spacing:-0.01em;}\n  p{margin:0;}\n  a{color:inherit;}\n  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}\n\n  .topbar{background:var(--navy);color:var(--white);padding:18px 24px;text-align:center;font-size:13px;font-weight:600;letter-spacing:0.03em;}\n  .wrap{max-width:680px;margin:0 auto;padding:56px 20px 80px;}\n\n  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:14px 26px;border-radius:4px;cursor:pointer;border:1px solid transparent;font-family:'Inter',sans-serif;}\n  .btn .arrow{transition:transform .15s ease;}\n  .btn:hover .arrow{transform:translateX(4px);}\n  .btn-primary{background:var(--green);color:var(--navy);}\n  .btn-primary:disabled{opacity:0.45;cursor:not-allowed;}\n  .btn-primary:disabled .arrow{transform:none;}\n  .btn-ghost{background:transparent;color:var(--navy);border-color:var(--line);}\n\n  .card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:44px 40px;}\n  .kicker{font-size:13px;font-weight:600;color:var(--green);margin-bottom:14px;}\n  .intro h1{font-size:32px;font-weight:700;line-height:1.2;}\n  .intro p.sub{margin-top:16px;font-size:16px;color:var(--slate);line-height:1.65;}\n  .intro .meta{margin-top:20px;font-size:13px;color:var(--slate);}\n  .intro .ctas{margin-top:30px;}\n  .why-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:36px;}\n  .why-card{border:1px solid var(--line);border-radius:6px;padding:20px;}\n  .why-card h3{font-size:14px;font-weight:700;margin-bottom:6px;}\n  .why-card p{font-size:13px;color:var(--slate);line-height:1.5;}\n\n  .progress-wrap{margin-bottom:28px;}\n  .progress-top{display:flex;justify-content:space-between;font-size:13px;color:var(--slate);margin-bottom:10px;font-weight:600;}\n  .progress-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;}\n  .progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .35s ease;}\n\n  .step-title{font-size:24px;font-weight:700;margin-bottom:10px;}\n  .step-sub{font-size:15px;color:var(--slate);margin-bottom:28px;line-height:1.6;}\n\n  .field{margin-top:20px;}\n  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;}\n  .field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:6px;font-family:'Inter',sans-serif;font-size:15px;color:var(--navy);background:var(--white);}\n  .field textarea{resize:vertical;min-height:90px;}\n  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}\n  .field .err{color:var(--danger);font-size:13px;margin-top:6px;display:none;}\n  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger);}\n  .field.invalid .err{display:block;}\n  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}\n\n  /* SERVICE CHIPS */\n  .chip-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}\n  .chip{border:1.5px solid var(--line);border-radius:20px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;background:var(--white);transition:border-color .15s ease,background .15s ease;}\n  .chip[aria-pressed=\"true\"]{border-color:var(--green);background:rgba(31,163,122,0.08);color:#0F6E56;}\n\n  /* SCHEDULING */\n  .date-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-top:8px;}\n  .date-btn{flex-shrink:0;border:1.5px solid var(--line);border-radius:8px;padding:14px 16px;text-align:center;cursor:pointer;background:var(--white);min-width:76px;}\n  .date-btn .dow{font-size:12px;color:var(--slate);font-weight:600;}\n  .date-btn .dnum{font-size:18px;font-weight:700;margin-top:2px;}\n  .date-btn[aria-pressed=\"true\"]{border-color:var(--green);background:rgba(31,163,122,0.08);}\n  .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;}\n  .time-btn{border:1.5px solid var(--line);border-radius:6px;padding:12px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;background:var(--white);}\n  .time-btn[aria-pressed=\"true\"]{border-color:var(--green);background:rgba(31,163,122,0.08);color:#0F6E56;}\n  .tz-note{font-size:12px;color:var(--slate);margin-top:14px;}\n\n  .consent{display:flex;gap:10px;margin-top:22px;align-items:flex-start;}\n  .consent input{margin-top:3px;}\n  .consent label{font-size:13px;color:var(--slate);line-height:1.5;}\n  .privacy-link{font-size:13px;color:var(--blue);font-weight:600;display:inline-block;margin-top:14px;}\n\n  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:32px;}\n  .back-link{font-size:14px;font-weight:600;color:var(--slate);cursor:pointer;background:none;border:none;padding:8px;font-family:'Inter',sans-serif;}\n  .back-link:disabled{opacity:0;pointer-events:none;}\n\n  /* CONFIRMATION */\n  .confirm-icon{width:56px;height:56px;border-radius:50%;background:rgba(31,163,122,0.14);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}\n  .confirm-card{text-align:center;}\n  .confirm-card h1{font-size:28px;font-weight:700;}\n  .confirm-card p.sub{margin:14px auto 0;max-width:440px;font-size:15px;color:var(--slate);line-height:1.6;}\n  .summary-box{background:var(--paper);border-radius:8px;padding:24px;margin-top:28px;text-align:left;}\n  .summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}\n  .summary-row:last-child{border-bottom:none;}\n  .summary-row .slabel{color:var(--slate);}\n  .summary-row .sval{font-weight:600;text-align:right;}\n  .next-steps{margin-top:32px;text-align:left;}\n  .next-steps h3{font-size:16px;font-weight:700;margin-bottom:14px;}\n  .next-item{display:flex;gap:12px;padding:10px 0;font-size:14px;color:var(--slate);}\n  .next-item .n{width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--white);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}\n  .confirm-card .ctas{margin-top:32px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}\n\n  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}\n\n  @media (max-width:600px){\n    .wrap{padding:32px 16px 64px;}\n    .card{padding:26px 22px;}\n    .why-grid,.two-col,.time-grid{grid-template-columns:1fr;}\n    .intro h1{font-size:26px;}\n  }\n</style>\n</head>\n<body>\n\n<div class=\"topbar\">BOOK A CONSULTATION</div>\n<div class=\"wrap\" id=\"app\"></div>\n<div aria-live=\"polite\" class=\"sr-only\" id=\"live-region\"></div>\n\n<script>\nconst SERVICES = [\n  'IT & Digital','Finance & Performance','Marketing & Brand Growth',\n  'Operations & Process Excellence','Sales & Revenue Growth','Not sure yet \u2014 general consultation'\n];\nconst COMPANY_SIZES = ['1\u201310 employees','11\u201350 employees','51\u2013200 employees','200+ employees'];\n\nfunction nextBusinessDays(n){\n  const days=[]; let d=new Date(); let count=0;\n  while(days.length<n){\n    d = new Date(d.getTime()+86400000);\n    if(d.getDay()!==0 && d.getDay()!==6){ days.push(new Date(d)); }\n  }\n  return days;\n}\nconst DATES = nextBusinessDays(5);\nconst TIMES = ['9:00 AM','10:30 AM','1:00 PM','2:30 PM','4:00 PM','5:00 PM'];\n\nlet state = {\n  screen:'intro',\n  step:1,\n  data:{ company:'', size:'', challenge:'', services:[], dateIndex:null, time:null, name:'', email:'', phone:'', role:'', consent:false }\n};\nconst app = document.getElementById('app');\nconst live = document.getElementById('live-region');\nfunction announce(msg){ live.textContent = msg; }\nconst TOTAL_STEPS = 4;\n\nfunction render(){\n  if(state.screen==='intro') renderIntro();\n  else if(state.screen==='form') renderStep();\n  else if(state.screen==='confirmation') renderConfirmation();\n  window.scrollTo({top:0,behavior:'auto'});\n}\n\nfunction renderIntro(){\n  app.innerHTML = `\n    <div class=\"card intro\">\n      <div class=\"kicker\">Book a Consultation</div>\n      <h1>Let's talk about your business.</h1>\n      <p class=\"sub\">This isn't a sales pitch. It's a focused conversation about where your business is today, what's getting in the way of growth, and whether be.up is a good fit to help.</p>\n      <div class=\"meta\">Takes about 3 minutes to book. The consultation itself is 30 minutes.</div>\n      <div class=\"ctas\"><button class=\"btn btn-primary\" id=\"start-btn\">Start Booking <span class=\"arrow\">\u2192</span></button></div>\n      <div class=\"why-grid\">\n        <div class=\"why-card\"><h3>No obligation</h3><p>A conversation to understand fit \u2014 not a locked-in engagement.</p></div>\n        <div class=\"why-card\"><h3>Focused on you</h3><p>We'll ask about your business before we talk about our services.</p></div>\n        <div class=\"why-card\"><h3>Clear next step</h3><p>You'll leave knowing whether and how be.up can help.</p></div>\n      </div>\n    </div>\n  `;\n  document.getElementById('start-btn').addEventListener('click', ()=>{ state.screen='form'; state.step=1; render(); });\n}\n\nfunction stepShell(title, sub, bodyHtml, canProceed, isLast){\n  const pct = Math.round(((state.step-1)/TOTAL_STEPS)*100);\n  return `\n    <div class=\"progress-wrap\">\n      <div class=\"progress-top\"><span>Step ${state.step} of ${TOTAL_STEPS}</span><span>${pct}% Complete</span></div>\n      <div class=\"progress-track\"><div class=\"progress-fill\" style=\"width:${pct}%\"></div></div>\n    </div>\n    <div class=\"card\">\n      <div class=\"step-title\">${title}</div>\n      <div class=\"step-sub\">${sub}</div>\n      ${bodyHtml}\n      <div class=\"nav-row\">\n        <button class=\"back-link\" id=\"back-btn\" ${state.step===1 ? 'disabled':''}>\u2190 Back</button>\n        <button class=\"btn btn-primary\" id=\"next-btn\" ${canProceed ? '' : 'disabled'}>${isLast ? 'Confirm Booking' : 'Continue'} <span class=\"arrow\">\u2192</span></button>\n      </div>\n    </div>\n  `;\n}\n\nfunction renderStep(){\n  const d = state.data;\n  if(state.step===1){\n    const canProceed = d.company.trim().length>0 && d.size.length>0;\n    app.innerHTML = stepShell('Tell us about your business', 'A little context helps us prepare for a useful conversation.', `\n      <div class=\"field\" data-field=\"company\">\n        <label for=\"f-company\">Company name</label>\n        <input type=\"text\" id=\"f-company\" value=\"${d.company}\">\n        <div class=\"err\">Enter your company name.</div>\n      </div>\n      <div class=\"field\" data-field=\"size\">\n        <label for=\"f-size\">Company size</label>\n        <select id=\"f-size\">\n          <option value=\"\" ${d.size===''?'selected':''} disabled>Select company size</option>\n          ${COMPANY_SIZES.map(s=>`<option value=\"${s}\" ${d.size===s?'selected':''}>${s}</option>`).join('')}\n        </select>\n        <div class=\"err\">Select your company size.</div>\n      </div>\n      <div class=\"field\">\n        <label for=\"f-challenge\">What's the main challenge you'd like to discuss? <span style=\"font-weight:400;color:var(--slate);\">(optional)</span></label>\n        <textarea id=\"f-challenge\">${d.challenge}</textarea>\n      </div>\n    `, canProceed, false);\n    document.getElementById('f-company').addEventListener('input', e=>d.company=e.target.value);\n    document.getElementById('f-size').addEventListener('change', e=>{ d.size=e.target.value; renderStep(); });\n    document.getElementById('f-challenge').addEventListener('input', e=>d.challenge=e.target.value);\n    bindNav(1, canProceed);\n  }\n  else if(state.step===2){\n    const canProceed = d.services.length>0;\n    app.innerHTML = stepShell('What would you like to discuss?', 'Select one or more areas. This helps us bring the right person to the call.', `\n      <div class=\"chip-grid\" role=\"group\" aria-label=\"Select topics\">\n        ${SERVICES.map(s=>`<button type=\"button\" class=\"chip\" aria-pressed=\"${d.services.includes(s)}\" data-s=\"${s}\">${s}</button>`).join('')}\n      </div>\n    `, canProceed, false);\n    document.querySelectorAll('.chip').forEach(btn=>{\n      btn.addEventListener('click', ()=>{\n        const s = btn.dataset.s;\n        if(d.services.includes(s)) d.services = d.services.filter(x=>x!==s);\n        else d.services.push(s);\n        renderStep();\n      });\n    });\n    bindNav(2, canProceed);\n  }\n  else if(state.step===3){\n    const canProceed = d.dateIndex!==null && d.time!==null;\n    app.innerHTML = stepShell('Choose a time', 'Pick a date and time that works for you. Times shown in your local timezone.', `\n      <label style=\"font-size:13px;font-weight:600;\">Date</label>\n      <div class=\"date-row\" role=\"group\" aria-label=\"Select a date\">\n        ${DATES.map((dt,i)=>`\n          <button type=\"button\" class=\"date-btn\" aria-pressed=\"${d.dateIndex===i}\" data-i=\"${i}\">\n            <div class=\"dow\">${dt.toLocaleDateString(undefined,{weekday:'short'})}</div>\n            <div class=\"dnum\">${dt.getDate()}</div>\n          </button>\n        `).join('')}\n      </div>\n      <label style=\"font-size:13px;font-weight:600;display:block;margin-top:24px;\">Time</label>\n      <div class=\"time-grid\" role=\"group\" aria-label=\"Select a time\">\n        ${TIMES.map(t=>`<button type=\"button\" class=\"time-btn\" aria-pressed=\"${d.time===t}\" data-t=\"${t}\">${t}</button>`).join('')}\n      </div>\n      <div class=\"tz-note\">Timezone detected automatically from your browser.</div>\n    `, canProceed, false);\n    document.querySelectorAll('.date-btn').forEach(btn=>{\n      btn.addEventListener('click', ()=>{ d.dateIndex=parseInt(btn.dataset.i,10); renderStep(); });\n    });\n    document.querySelectorAll('.time-btn').forEach(btn=>{\n      btn.addEventListener('click', ()=>{ d.time=btn.dataset.t; renderStep(); });\n    });\n    bindNav(3, canProceed);\n  }\n  else if(state.step===4){\n    const canProceed = true;\n    app.innerHTML = stepShell('Your details', \"We'll send your confirmation and calendar invite here.\", `\n      <div class=\"two-col\">\n        <div class=\"field\" data-field=\"name\">\n          <label for=\"f-name\">Full name</label>\n          <input type=\"text\" id=\"f-name\" value=\"${d.name}\">\n          <div class=\"err\">Enter your name.</div>\n        </div>\n        <div class=\"field\" data-field=\"role\">\n          <label for=\"f-role\">Job role</label>\n          <input type=\"text\" id=\"f-role\" value=\"${d.role}\">\n          <div class=\"err\">Enter your job role.</div>\n        </div>\n      </div>\n      <div class=\"field\" data-field=\"email\">\n        <label for=\"f-email\">Work email</label>\n        <input type=\"email\" id=\"f-email\" value=\"${d.email}\">\n        <div class=\"err\">Enter a valid email address.</div>\n      </div>\n      <div class=\"field\">\n        <label for=\"f-phone\">Phone <span style=\"font-weight:400;color:var(--slate);\">(optional)</span></label>\n        <input type=\"tel\" id=\"f-phone\" value=\"${d.phone}\">\n      </div>\n      <div class=\"consent\">\n        <input type=\"checkbox\" id=\"f-consent\" ${d.consent?'checked':''}>\n        <label for=\"f-consent\">I agree to be contacted by be.up regarding this consultation request.</label>\n      </div>\n      <div class=\"field\" data-field=\"consent\" style=\"margin-top:0;\"><div class=\"err\">Please confirm you agree to be contacted.</div></div>\n      <a href=\"/privacy\" class=\"privacy-link\">Privacy Policy</a>\n    `, canProceed, true);\n    document.getElementById('f-name').addEventListener('input', e=>d.name=e.target.value);\n    document.getElementById('f-role').addEventListener('input', e=>d.role=e.target.value);\n    document.getElementById('f-email').addEventListener('input', e=>d.email=e.target.value);\n    document.getElementById('f-phone').addEventListener('input', e=>d.phone=e.target.value);\n    document.getElementById('f-consent').addEventListener('change', e=>d.consent=e.target.checked);\n    bindNav(4, canProceed, true);\n  }\n}\n\nfunction bindNav(step, canProceed, isFinal){\n  document.getElementById('back-btn').addEventListener('click', ()=>{\n    if(state.step>1){ state.step--; render(); }\n  });\n  document.getElementById('next-btn').addEventListener('click', ()=>{\n    if(isFinal){\n      const d = state.data;\n      let valid = true;\n      const setInvalid=(field,ok)=>{ const el=document.querySelector(`.field[data-field=\"${field}\"]`); if(el){el.classList.toggle('invalid',!ok);} if(!ok) valid=false; };\n      setInvalid('name', d.name.trim().length>0);\n      setInvalid('role', d.role.trim().length>0);\n      setInvalid('email', /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(d.email));\n      setInvalid('consent', d.consent);\n      if(!valid){ announce('Please correct the highlighted fields.'); return; }\n      state.screen='confirmation'; render(); return;\n    }\n    if(!canProceed) return;\n    state.step++; render();\n  });\n}\n\nfunction renderConfirmation(){\n  const d = state.data;\n  const dt = DATES[d.dateIndex];\n  app.innerHTML = `\n    <div class=\"card confirm-card\">\n      <div class=\"confirm-icon\">\n        <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1FA37A\" stroke-width=\"2.5\"><path d=\"M4 12l5 5L20 6\"/></svg>\n      </div>\n      <h1>You're booked, ${d.name.split(' ')[0]}.</h1>\n      <p class=\"sub\">A calendar invite and confirmation are on their way to ${d.email}. We look forward to talking through your business.</p>\n      <div class=\"summary-box\">\n        <div class=\"summary-row\"><span class=\"slabel\">Date &amp; time</span><span class=\"sval\">${dt.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}, ${d.time}</span></div>\n        <div class=\"summary-row\"><span class=\"slabel\">Company</span><span class=\"sval\">${d.company}</span></div>\n        <div class=\"summary-row\"><span class=\"slabel\">Topics</span><span class=\"sval\">${d.services.join(', ')}</span></div>\n      </div>\n      <div class=\"next-steps\">\n        <h3>What happens next</h3>\n        <div class=\"next-item\"><span class=\"n\">1</span><span>You'll receive a confirmation email with a calendar invite and video call link.</span></div>\n        <div class=\"next-item\"><span class=\"n\">2</span><span>A be.up consultant will review your details before the call.</span></div>\n        <div class=\"next-item\"><span class=\"n\">3</span><span>We'll talk through your business and the areas you flagged \u2014 no prepared pitch.</span></div>\n      </div>\n      <div class=\"ctas\">\n        <a href=\"/\" class=\"btn btn-primary\">Back to Home <span class=\"arrow\">\u2192</span></a>\n        <a href=\"/approach\" class=\"btn btn-ghost\">Explore Our Approach</a>\n      </div>\n    </div>\n  `;\n}\n\nrender();\n<\/script>\n\n</body>\n</html>\n"};
  var frame = document.getElementById('page-frame');

  var errBanner = document.getElementById('err-banner');

  function showPage(key){
    if(!PAGES[key]){
      errBanner.textContent = 'Page "' + key + '" was not found in this bundle.';
      errBanner.style.display = 'block';
      return;
    }
    errBanner.style.display = 'none';
    frame.srcdoc = PAGES[key];
    buttons.forEach(function(b){ b.classList.toggle('active', b.dataset.key === key); });
  }

  buttons.forEach(function(b){
    b.addEventListener('click', function(){ showPage(b.dataset.key); });
  });

  showPage('home');
</script>

</body>
</html>
