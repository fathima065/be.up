name: be.up homepage deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good bundle and inject homepage
        shell: bash
        run: |
          set -e
          git show 27ad1ab71696d0518c18dc2c1712075cebb9085f:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          for marker in [
            '<script src="/responsive-fixes.js"></script>',
            '<script src="/responsive-frame.js"></script>',
            '<script src="/contact-demo.js"></script>',
            '<script src="/premium-redesign.js"></script>',
            '<script src="/home-redesign.js"></script>',
            '<script src="/home-meta.js"></script>',
            '<script src="/home-production.js"></script>',
            '<script src="/home-iframe-fix.js"></script>'
          ]:
            if marker not in s:
              s=s.replace('</body>\n</html>',marker+'\n</body>\n</html>',1)
          p.write_text(s)
          PY
      - name: Commit restored bundle
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy final homepage redesign without changing other pages'
          git push
