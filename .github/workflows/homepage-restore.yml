name: be.up homepage deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable bundle
        shell: bash
        run: |
          set -e
          git show 27ad1ab71696d0518c18dc2c1712075cebb9085f:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<script\s+src=["\']/(?:responsive-fixes|responsive-frame|contact-demo|premium-redesign|home-redesign|home-iframe-fix|home-meta|home-production|home-reference-style|site-production|site-shell)\.js["\']\s*></script>', '', s, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit stable bundle
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore stable site without injected redesign scripts'
          git push
